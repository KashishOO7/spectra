<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f4ef" />
    <meta name="color-scheme" content="only light" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <script>
      (function () {
        var theme = 'light';
        try {
          if (localStorage.getItem('spectra-theme') === 'dark') theme = 'dark';
        } catch (e) {
        }
        document.documentElement.setAttribute('data-theme', theme);
        var scheme = document.querySelector('meta[name="color-scheme"]');
        if (scheme) scheme.setAttribute('content', theme === 'dark' ? 'dark' : 'only light');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f6f4ef' : '#0f1217');
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spectra" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />

    <meta name="robots" content="index, follow" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none';" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <meta name="disclaimer" content="Spectra is for educational purposes only. Not legal, professional security, or medical advice. Use at your own risk. Open source: AGPL-3.0 (code) / CC BY-SA 4.0 (content)." />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Spectra",
        "url": "https://spectra.fpszero.com/",
        "applicationCategory": "SecurityApplication",
        "operatingSystem": "Any browser",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "license": "https://www.gnu.org/licenses/agpl-3.0.html",
        "author": { "@type": "Organization", "name": "FPS Zero", "url": "https://fpszero.com" },
        "description": "Spectra is a free security playbook: guided steps for your accounts, money, devices and privacy, so you know what to do first, before something goes wrong and right after it does. Runs in your browser, with no account."
      }
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-void text-body font-sans antialiased">
    <div id="svelte">%sveltekit.body%</div>
  </body>
</html>
