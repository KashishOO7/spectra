<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080c12" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spectra" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.svg" />

    <!-- Spectra: Personal Security Self-Audit Framework -->
    <meta name="description" content="Know exactly how exposed you are. Spectra is an open-source personal security audit framework built from first principles." />
    <meta name="robots" content="index, follow" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=JetBrains+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />

    <meta name="disclaimer" content="Spectra is for educational purposes only. Not legal, professional security, or medical advice. Use at your own risk. Open source: AGPL-3.0 (code) / CC BY-SA 4.0 (content)." />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-void text-body font-sans antialiased">
    <div id="svelte">%sveltekit.body%</div>
  </body>
</html>
