name: Weekly URL Health Check

on:
  # Disabled: dead-link checking now runs locally via `npm run check:links`.
  # schedule:
  #   - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  url-check:
    name: Check resource URLs for dead links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: |
          find content/ -name "*.yaml" -o -name "*.yml" | \
            xargs grep -h "url:" 2>/dev/null | \
            sed 's/.*url: *["\x27]\?\([^"\x27]*\)["\x27]\?.*/\1/' | \
            grep "^https\?://" | \
            sort -u > /tmp/all_urls.txt

          echo "Checking $(wc -l < /tmp/all_urls.txt) unique URLs..."
          DEAD=0
          while IFS= read -r url; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url" 2>/dev/null)
            if [ "$STATUS" = "404" ] || [ "$STATUS" = "000" ]; then
              echo "DEAD: $url → $STATUS"
              DEAD=$((DEAD+1))
            fi
          done < /tmp/all_urls.txt

          echo "Dead links found: $DEAD"