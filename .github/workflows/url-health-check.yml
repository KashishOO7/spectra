name: Weekly URL Health Check

on:
  # Disabled: dead-link checking now runs locally via `npm run check:links`.
  # schedule:
  #   - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  url-check:
    name: Check resource URLs for dead links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # The same check as `npm run check:links`, which reads every source in the notes in wiki/.
      - run: npx tsx scripts/check-links.ts