# Table C. The three questions, drawn from the corpus's own model.

- id: lookup-is-this-a-scam-001
  schema_version: 1.0.0
  version: 1.0.0
  title: Three questions before you act on a message
  intro: >-
    Bad spelling used to be the giveaway. It is not any more, because anything can write clean
    English now. These three questions still work, because they are about the situation rather than
    the wording.
  status: active
  last_verified: '2026-08-26'
  verified_by: spectra-maintainer
  rows:
    - look_for: Did I start this?
      also_called: Initiation
      why: You went to them, or they came to you. Anything that arrived on its own deserves more suspicion.
    - look_for: Is it rushing me, scaring me, or offering me something?
      also_called: Urgency · Fear · Reward · Authority
      why: Pressure is there to stop you checking. A real emergency survives ten minutes.
    - look_for: Is it asking me to do something?
      also_called: Action
      why: Click a link, open a file, type a password, move money. A message asking nothing is rarely the problem.
  notes:
    - If it arrived on its own, presses you, and wants an action, treat it as hostile until you have checked.
    - Check by going back a different way. Type the address yourself, or use a number you already had. Never a number or link from the message.
  sources:
    - title: 'EFF Surveillance Self-Defense: How to avoid phishing attacks'
      url: https://ssd.eff.org/module/how-avoid-phishing-attacks
