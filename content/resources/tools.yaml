- id: "res-tool-keepassxc-001"
  schema_version: "1.0.0"
  version: "1.0.0"
  type: "tool"
  title: "KeePassXC"
  url: "https://keepassxc.org"
  description: |
    Fully offline, open-source password manager that stores your vault as an encrypted local file
    (AES-256 or ChaCha20). No cloud sync by default — you own the file and control exactly where it
    goes. Also supports TOTP codes built-in, making it a combined password + authenticator solution.
    Best choice for users who cannot or will not trust cloud-based password managers.
  platforms: ["windows", "macos", "linux"]
  adversaries_addressed: ["opportunistic", "criminal_org", "targeted_individual", "domestic_government", "foreign_government"]
  categories_relevant: ["account_security"]
  tracks: ["general", "journalist"]
  cost: "free"
  open_source: true
  source_url: "https://github.com/keepassxreboot/keepassxc"
  license: "GPL-3.0"
  privacy_posture: "privacy_first"
  caveats:
    - "No built-in sync — you must manage your vault file across devices yourself (e.g. via Syncthing or manual transfer)."
    - "Less beginner-friendly than cloud password managers. Setup requires more deliberate configuration."
  security_audits:
    - url: "https://keepassxc.org/audits/"
      conducted_by: "Assured Information Security"
      year: 2023
      summary: "Security audit commissioned by the project. No critical vulnerabilities found."
  alternatives:
    - id: "res-tool-bitwarden-001"
      note: "Cloud-synced alternative. Better UX for most users, slightly weaker threat model for offline-first needs."
  endorsing_orgs: ["privacyguides.org"]
  distribution:
    - platform: "all"
      store: "Official site"
      url: "https://keepassxc.org/download/"
      preferred: true
      note: "Available for Windows, macOS, Linux."
  status: "active"
  last_verified: "2026-02-01"
  verified_by: ["org:privacyguides.org"]
  sources:
    - url: "https://privacyguides.org/en/passwords/#keepassxc"
      title: "KeePassXC — Privacy Guides"
      type: "primary"
      accessed: "2026-02-01"
