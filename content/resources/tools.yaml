# What this file holds, since L6: guides, not products.
#
# It used to be a catalogue of eight named tools. L7 archived the two we advised against; L6
# archived the six we recommended. Both removals came from the same rule: Spectra names no tool it
# tells you to go and get, because that is a claim about a company that goes stale in silence.
#
# What replaces them are the sections of maintained directories that list current picks. The
# division of labour is deliberate. We keep the part that stays true — what kind of tool you need,
# and what to look for, which is `lookup-choosing-a-tool-001`. They keep the part that changes —
# which product this year. They update far more often than we could, and they say so publicly.
#
# Rules for adding an entry:
#   - It must be a section of a directory that someone else maintains, not a product.
#   - It must be non-commercial: no affiliate links, no paid placement, no vendor ownership.
#   - `description` says what the section lists. It must not praise or rank anything.
#   - The URL must resolve to the section, not to a homepage the reader then has to search.
#
# Every URL below was fetched and confirmed to load and to contain what the description claims,
# 2026-08-26. That check is L8's job at launch and should be repeated there.

