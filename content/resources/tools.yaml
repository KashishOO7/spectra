- id: "res-tool-protonvpn-001"
  schema_version: "1.0.0"
  version: "1.0.0"
  type: "tool"
  title: "Proton VPN"
  url: "https://protonvpn.com"
  description: |
    Open-source VPN with a verified no-logs policy (independently audited), based in Switzerland
    with strong legal privacy protections. The free tier is genuinely usable — no data caps,
    no speed throttling on slower servers, and no ads. Protects traffic from ISP surveillance,
    network-level interception, and WiFi eavesdropping.
  platforms: ["windows", "macos", "linux", "android", "ios"]
  adversaries_addressed: ["isp_network", "opportunistic", "criminal_org", "data_broker"]
  categories_relevant: ["network_security"]
  tracks: ["general", "journalist"]
  cost: "freemium"
  open_source: true
  source_url: "https://github.com/ProtonVPN"
  license: "GPL-3.0"
  privacy_posture: "privacy_first"
  caveats:
    - "A VPN shifts trust from your ISP to the VPN provider — it does not make you anonymous. Proton has a strong track record, but this trade-off applies to all VPNs."
    - "Free tier is limited to slower servers in 3 countries. Paid plans unlock more locations and higher speeds."
    - "VPNs do not protect against malware, phishing, or account compromise — they only protect network-layer traffic."
  security_audits:
    - url: "https://protonvpn.com/blog/no-logs-audit/"
      conducted_by: "Securitum"
      year: 2022
      summary: "No-logs policy verified. No evidence of user traffic or connection logs retained."
  alternatives: []
  endorsing_orgs: ["privacyguides.org"]
  distribution:
    - platform: "all"
      store: "Official site"
      url: "https://protonvpn.com/download"
      preferred: true
      note: "Apps for all major platforms."
  status: "active"
  last_verified: "2026-02-01"
  verified_by: ["org:privacyguides.org"]
  sources:
    - url: "https://privacyguides.org/en/vpn/#proton-vpn"
      title: "Proton VPN — Privacy Guides"
      type: "primary"
      accessed: "2026-02-01"
