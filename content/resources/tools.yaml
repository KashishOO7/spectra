- id: "res-tool-google-auth-001"
  schema_version: "1.0.0"
  version: "1.0.0"
  type: "tool"
  title: "Google Authenticator"
  url: "https://support.google.com/accounts/answer/1066447"
  description: |
    Google's TOTP authenticator app. Listed here as a redirect — users who already
    have it installed should be aware of its limitations and consider migrating to Aegis
    (Android) or Raivo (iOS). Not recommended for new setups.
  platforms: ["android", "ios"]
  adversaries_addressed: []
  categories_relevant: ["account_security"]
  tracks: ["general"]
  cost: "free"
  open_source: false
  source_url: null
  license: null
  privacy_posture: "avoid"
  caveats:
    - "Closed source — the codebase cannot be audited for security or privacy issues."
    - "Until 2023, had no encrypted backup — codes were stored in plaintext and unrecoverable if your phone was lost. Cloud backup was added in 2023 but sync is tied to a Google account."
    - "Cloud sync links your 2FA codes to Google's servers and your Google account identity. For a framework concerned with minimising data exposure to large platforms, this is a significant trade-off."
    - "No open-source alternative to verify the backup encryption implementation."
    - "Google is an advertising company. Associating your 2FA activity with a Google account is inconsistent with this framework's threat model for users concerned about data brokers or targeted surveillance."
  security_audits: []
  alternatives:
    - id: "res-tool-aegis-001"
      note: "Recommended Android replacement. Open source, encrypted offline backups, audited by Cure53."
  endorsing_orgs: []
  distribution:
    - platform: "android"
      store: "Google Play"
      url: "https://play.google.com/store/apps/details?id=com.google.android.apps.authenticator2"
      preferred: false
      note: "Not recommended — listed for users already using this app."
    - platform: "ios"
      store: "App Store"
      url: "https://apps.apple.com/app/google-authenticator/id388497605"
      preferred: false
      note: "Not recommended — listed for users already using this app."
  status: "active"
  last_verified: "2026-03-01"
  verified_by: ["org:privacyguides.org"]
  sources:
    - url: "https://privacyguides.org/en/multi-factor-authentication/"
      title: "Multi-Factor Authentication — Privacy Guides"
      type: "primary"
      accessed: "2026-03-01"
  tags: ["closed_source", "google", "avoid", "cloud_tied"]
  created_at: "2026-03-01"
  created_by: "github:@KashishOO7"
  changelog:
    - version: "1.0.0"
      date: "2026-03-01"
      changes: "Initial entry as avoid resource. Redirects users to Aegis."
      author: "github:@KashishOO7"

- id: "res-tool-authy-001"
  schema_version: "1.0.0"
  version: "1.0.0"
  type: "tool"
  title: "Authy"
  url: "https://authy.com"
  description: |
    Twilio's TOTP authenticator. Listed here as a redirect — users who already have
    it installed should be aware of its limitations and consider migrating to Aegis
    (Android) or Raivo (iOS). Not recommended for new setups.
  platforms: ["android", "ios", "windows", "macos", "linux"]
  adversaries_addressed: []
  categories_relevant: ["account_security"]
  tracks: ["general"]
  cost: "free"
  open_source: false
  source_url: null
  license: null
  privacy_posture: "avoid"
  caveats:
    - "Closed source — codebase cannot be audited."
    - "Owned by Twilio, a US company subject to US legal process. Your 2FA backup is stored on Twilio's servers, not locally."
    - "Twilio suffered a significant data breach in 2022 in which attacker accessed employee accounts and some customer data. Subsequent audit found Authy phone numbers were exposed in a 2024 API vulnerability affecting 33 million accounts."
    - "Account recovery is phone-number-based, which creates a SIM swap vulnerability — the same attack vector that 2FA is supposed to prevent."
    - "Multi-device sync is convenient but means your 2FA codes exist on Twilio's infrastructure, not solely on your device."
  security_audits: []
  alternatives:
    - id: "res-tool-aegis-001"
      note: "Recommended Android replacement. Open source, encrypted local backups, no cloud dependency."
  endorsing_orgs: []
  distribution:
    - platform: "android"
      store: "Google Play"
      url: "https://play.google.com/store/apps/details?id=com.authy.authy"
      preferred: false
      note: "Not recommended — listed for users already using this app."
    - platform: "ios"
      store: "App Store"
      url: "https://apps.apple.com/app/twilio-authy/id494168017"
      preferred: false
      note: "Not recommended — listed for users already using this app."
  status: "active"
  last_verified: "2026-03-01"
  verified_by: ["org:privacyguides.org"]
  sources:
    - url: "https://privacyguides.org/en/multi-factor-authentication/"
      title: "Multi-Factor Authentication — Privacy Guides"
      type: "primary"
      accessed: "2026-03-01"
    - url: "https://techcrunch.com/2024/07/03/twilio-says-hackers-identified-cell-phone-numbers-of-two-factor-app-authy-users/"
      title: "Twilio says hackers identified cell phone numbers of 33M Authy users — TechCrunch"
      type: "supporting"
      accessed: "2026-03-06"
  tags: ["closed_source", "cloud_tied", "avoid", "breach_history"]
  created_at: "2026-03-01"
  created_by: "github:@KashishOO7"
  changelog:
    - version: "1.0.0"
      date: "2026-03-01"
      changes: "Initial entry as avoid resource. Documents Twilio breach history and SIM swap risk."
      author: "github:@KashishOO7"