id: data-permissions-001
schema_version: 1.0.0
version: 1.1.0
title: Check which apps can see your camera, mic and location
simple_description: Turn off camera, microphone and location access for apps that do not need it.
description: |
  Apps routinely request access to your location, microphone, camera, contacts, and photos
  far beyond what their core function requires. Each granted permission is a standing data
  collection agreement. A periodic audit — removing permissions from apps that don't need them —
  significantly reduces the passive data collection happening on your devices.
threat_narrative: |
  A flashlight app with location access sells your GPS traces to data brokers. A keyboard app
  with full network access logs your keystrokes. A game with contacts access maps your social
  graph. This is not theoretical — apps have been caught doing all of these things. In 2023,
  research found that the average Android device had 40+ apps with location access, many of
  which had no plausible need for it. Each unnecessary permission is an open data channel to
  someone you didn't choose to share with.
category: data_management
subcategory: data_minimization
tracks:
  - general
platforms:
  - android
  - ios
  - windows
  - macos
platform_notes:
  all: >-
    Do this

    Go through the apps on your phone and take back the permissions they do not need.


    The question to ask

    If you cannot say why an app needs your camera, microphone, contacts or location to do its
    actual job, turn it off.

    A torch app does not need to know where you are.


    Location especially

    Change apps from always on to only while you are using them. Very little needs your location
    when it is closed.


    Test it

    Your phone keeps a recent access list, showing which apps used your camera, mic or location and
    when.

    Open it after a day and see who has been busy.
