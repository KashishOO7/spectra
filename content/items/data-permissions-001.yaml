id: "data-permissions-001"
schema_version: "1.0.0"
version: "1.0.0"
title: "Audit and revoke excessive app permissions"
description: |
  Apps routinely request access to your location, microphone, camera, contacts, and photos
  far beyond what their core function requires. Each granted permission is a standing data
  collection agreement. A periodic audit — removing permissions from apps that don't need them —
  significantly reduces the passive data collection happening on your devices.
threat_narrative: |
  A flashlight app with location access sells your GPS traces to data brokers. A keyboard app
  with full network access logs your keystrokes. A game with contacts access maps your social
  graph. This is not theoretical — apps have been caught doing all of these things. In 2023,
  research found that the average Android device had 40+ apps with location access, many of
  which had no plausible need for it. Each unnecessary permission is an open data channel to
  someone you didn't choose to share with.
category: data_management
subcategory: data_minimization
tracks: ["general"]
platforms: ["android", "ios", "windows", "macos"]
platform_notes:
  android: |
    Settings → Privacy → Permission Manager
    Review each category: Location, Microphone, Camera, Contacts, Storage, Phone.
    For Location specifically: change most apps from "Allow all the time" to
    "Allow only while using" or "Deny". Only navigation apps need always-on location.

    Also audit: Settings → Apps → [App] → Permissions for per-app view.

    Key red flags to revoke immediately:
    - Flashlight apps with location
    - Games with contacts or microphone
    - Utilities with camera access
    - Keyboards with network access (use Gboard or AOSP keyboard instead)

    Use "Permission Remover" mindset: if you cannot immediately explain WHY the app
    needs this permission for its core function, revoke it.
  ios: |
    Settings → Privacy & Security → [Each category]
    iOS is more restrictive by default but still worth auditing.

    Focus areas:
    - Location Services: Set most to "Never" or "While Using". Check for "Always" — should
      be only Maps or navigation apps.
    - Tracking: Settings → Privacy & Security → Tracking → disable "Allow Apps to Request"
    - Photos: most apps should have "Selected Photos" not "Full Access"
    - Contacts: revoke from social apps that don't need to find your contacts

    Check Settings → [App Name] for per-app permission summary.
  windows: |
    Settings → Privacy & Security → App Permissions
    Review each category: Location, Camera, Microphone, Contacts, Calendar.
    Disable access for the Microsoft Store categories entirely if you don't use those features.

    Also check: Settings → Privacy & Security → General → disable advertising ID and
    "Let websites show locally relevant content" (shares location to sites).
  macos: |
    System Settings → Privacy & Security
    Review: Location Services, Contacts, Calendars, Reminders, Photos, Camera, Microphone.
    For each: identify apps with access and revoke those with no clear need.

    Also check: System Settings → Privacy & Security → Accessibility — apps with
    accessibility access have broad system control. Only grant to trusted utilities.
