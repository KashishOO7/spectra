id: "net-dns-001"
schema_version: "1.0.0"
version: "2.0.0"
title: "Switch to an encrypted, private DNS resolver"
description: |
  Every website you visit generates a DNS query — the lookup that translates
  a domain name into an IP address. By default these queries travel unencrypted
  to your ISP's servers. Switching to an encrypted DNS resolver (DoH or DoT)
  hides your browsing destinations from your ISP and any network-level observer.
threat_narrative: |
  Your ISP sees a complete record of every domain you visit even when sites use HTTPS —
  because DNS queries travel in plaintext by default. In the US, ISPs can legally sell
  this browsing data. On public WiFi, anyone on the same network can read your DNS traffic.
  Encrypted DNS closes this specific surveillance channel without requiring a VPN.
  Your IP address is still visible to websites — this targets the ISP/network layer only.
category: "network_security"
subcategory: "dns"
tracks:
  - "general"
platforms:
  - "all"
platform_notes:
  windows: |
    Settings → Network & Internet → Wi-Fi or Ethernet → DNS server assignment → Manual.
    Toggle on "DNS over HTTPS (Automatic)". Enter 9.9.9.9 (Quad9) as your primary resolver.
    For NextDNS with custom filtering: use your personal NextDNS DoH URL from nextdns.io.
  macos: |
    The easiest approach on macOS is a DNS configuration profile.
    Quad9: download the profile at quad9.net/support/set-up-guides/macos
    NextDNS: install via nextdns.io/setup — generates a personal config profile.
    System Settings → Privacy & Security → Profiles to verify it installed.
  android: |
    Settings → Network & Internet → Private DNS → "Private DNS provider hostname".
    Enter: dns.quad9.net (Quad9, recommended for everyone)
    Or your NextDNS hostname (from nextdns.io/setup) for custom filtering.
    This enables DNS-over-TLS system-wide — covers all apps.
  ios: |
    iOS requires a DNS configuration profile — you can't set it manually in Settings.
    Quad9: profile at quad9.net/support/set-up-guides/ios
    NextDNS: profile generated at nextdns.io/setup (free, 300k queries/month)
    Settings → General → VPN & Device Management to install and verify.
  linux: |
    Option 1 (easiest): Use systemd-resolved with DoT.
    Edit /etc/systemd/resolved.conf: set DNS=9.9.9.9 and DNSOverTLS=yes
    Then: sudo systemctl restart systemd-resolved
    Option 2: Install dnscrypt-proxy for more control and DoH support.
    See: github.com/DNSCrypt/dnscrypt-proxy
  router: |
    Setting DNS on your router protects all devices on your network simultaneously —
    including IoT devices that can't be configured individually.
    In your router admin panel (usually 192.168.1.1), find DNS settings and replace
    your ISP's DNS with: 9.9.9.9 and 149.112.112.112 (Quad9)
    For NextDNS: create a free account at nextdns.io and use your custom endpoint URL.
