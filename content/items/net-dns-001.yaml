id: net-dns-001
schema_version: 1.0.0
version: 2.1.0
title: Stop your internet provider collecting a list of the sites you look up
simple_description: Switch on private DNS so your internet provider sees less of where you go.
description: |
  Every website you visit generates a DNS query — the lookup that translates
  a domain name into an IP address. By default these queries travel unencrypted
  to your ISP's servers. Switching to an encrypted DNS resolver (DoH or DoT)
  hides your browsing destinations from your ISP and any network-level observer.
threat_narrative: |
  Your ISP sees a complete record of every domain you visit even when sites use HTTPS —
  because DNS queries travel in plaintext by default. In the US, ISPs can legally sell
  this browsing data. On public WiFi, anyone on the same network can read your DNS traffic.
  Encrypted DNS closes this specific surveillance channel without requiring a VPN.
  Your IP address is still visible to websites — this targets the ISP/network layer only.
category: network_security
subcategory: dns
tracks:
  - general
platforms:
  - all
platform_notes:
  all: >-
    Do this

    Switch on private DNS, so the company providing your internet stops collecting a list of every
    site name your device looks up.


    What it does, and what it does not

    Every time you open a site, your device first asks for that site's name. Without this setting
    that question is sent in the open, and your internet provider can keep the list.

    Switching it on encrypts the question.

    It does not make you invisible. Your provider can still see the addresses your device connects
    to, so it can often still work out where you went. This closes one easy source of that list,
    not all of them.


    Where to look

    On a phone: network settings, then Private DNS or Encrypted DNS.

    On a computer: network settings, then Secure DNS or DNS over HTTPS. Your browser has its own
    version of this setting too.

    Setting it on your router covers everything on your network at once, including things with no
    settings of their own.


    You will need an address

    The setting asks you for one. The guide below lists current providers and says what each does
    with your queries.


    Test it

    Once saved, the setting should show the provider name or say it is connected. If it goes back to
    automatic, it did not take.
environment_notes:
  govt_monitors_traffic: >-
    What this setting does not hide

    It scrambles the question your device asks. It does not hide that you are asking it in a
    scrambled way, and someone watching the line closely can still see that much.

    Where traffic is inspected in that kind of detail, being one of the few people doing this can
    itself stand out.


    What helps

    Using it inside a VPN puts those questions in the same tunnel as everything else, so they stop
    being separately visible.

    That moves the view to the VPN company rather than removing it.
