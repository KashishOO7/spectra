environment_notes:
  govt_monitors_traffic: |
    DNS-over-HTTPS alone does not hide that you are using an encrypted DNS
    resolver — your ISP can still observe the traffic pattern. In environments
    with deep packet inspection, combine encrypted DNS with a VPN so DNS
    queries are tunnelled inside the VPN connection and not separately visible.
not_applicable_if:
  - condition: "item_implemented:net-vpn-001"
    reason: "A VPN tunnels all traffic including DNS, making a separate DNS resolver redundant for most threat models."
