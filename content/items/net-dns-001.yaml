# ── DNS Resolver Recommendation Matrix ───────────────────────────────────────
# Embedded as a comment for contributor reference. This drives platform_notes copy.
#
# Quad9 (9.9.9.9 / dns.quad9.net)
#   → Recommended for: everyone, easiest, zero configuration
#   → No-log policy. Automatic malware-blocking DNS. Non-profit (based in Switzerland).
#   → Privacy Guides rated. EFF endorsed.
#   → Free, no account required.
#
# NextDNS (nextdns.io)
#   → Recommended for: users wanting custom filtering, per-device rules, activity logs
#   → Free tier: 300k queries/month (enough for most users). Paid: unlimited.
#   → Creates a personal resolver endpoint — you control what's blocked.
#   → Logs are optional, scoped to your account, and deletable.
#
# AdGuard DNS (dns.adguard-dns.com)
#   → Recommended for: ad and tracker blocking focus
#   → Default mode blocks ads/trackers. Family mode adds adult content filtering.
#   → Free. No account required for default mode.
#   → Privacy Guides rated.
#
# Mullvad DNS (base.dns.mullvad.net)
#   → Recommended for: existing Mullvad VPN users
#   → No logs. Ad/tracker blocking variants available.
#
# AVOID:
#   Google Public DNS (8.8.8.8) — Google's core business is advertising. DNS data
#   feeds their profile. Antithetical to this framework. Do not recommend.
#
#   Cloudflare (1.1.1.1) — Mixed posture. Logs retained per Cloudflare's privacy policy
#   (anonymised, but retained). Better than ISP default, but not recommended here.
#   List as mixed if referenced in avoid-resources.
#
#   ISP default — No encryption, full logging, legally saleable in many jurisdictions.