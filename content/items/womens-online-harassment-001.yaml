legal_notes:
  - jurisdiction: "global"
    note: |
      Educational guidance only — not legal advice. Document everything before
      acting: evidence preserved now may be essential for legal action later.
      Organisations that can help:
      - Cyber Civil Rights Initiative: cybercivilrights.org (crisis line: +1-844-878-2274)
      - Coalition Against Online Violence: onlineviolenceresponsehub.org
      - Online SOS (journalists): onlinesos.org
      Laws around harassment, doxxing, and threatening communications vary by
      jurisdiction. A qualified attorney familiar with online abuse cases can advise
      on civil and criminal options.
  - jurisdiction: "GB"
    note: |
      The Online Safety Act 2023 covers coordinated harassment and sending harmful
      content. Report to police and to Ofcom for systemic platform failures.
      Suzy Lamplugh Trust (suzylamplugh.org) provides practical safety advice.

