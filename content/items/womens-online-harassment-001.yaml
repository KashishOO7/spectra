# PSSAF Checklist Item
# Personal Security Self-Audit Framework — womens_safety track
#
# Content review note: Online harassment campaigns disproportionately target women.
# Framing is practical and agency-centred. Documentation before action is emphasised
# because it preserves legal options. Avoids "just don't engage" as a sole response
# since this often doesn't stop campaigns and places burden on the target.

id: "womens-online-harassment-001"
schema_version: "1.0.0"
version: "1.0.0"

title: "Prepare a response plan for targeted online harassment"

description: |
  Targeted online harassment campaigns follow recognisable patterns: coordinated
  contact across platforms, public posts designed to amplify, doxxing, and contact
  attempts to employers or family. Having a prepared plan — documentation strategy,
  reporting pathways, privacy hardening steps — before an incident makes response
  faster and more effective. This item helps you build that plan.

threat_narrative: |
  Online harassment campaigns targeting women can escalate from social media attacks
  to physical-world contact within days, especially when home addresses or employer
  information is involved. Platforms' response times are measured in days; by then
  a campaign may have reached thousands of people. The psychological impact of
  sustained harassment is well-documented and severe. A prepared response plan
  doesn't prevent harassment, but it dramatically reduces the time between
  onset and effective action — and preserves the evidence needed for legal remedies.

category: "incident_response"
subcategory: "reporting"

tracks:
  - "womens_safety"

platforms:
  - "all"

platform_notes:
  web: |
    Documentation first — before blocking or reporting:
    Take screenshots with timestamps, noting platform, username, date, and content.
    Tools: GoFullPage (Chrome extension) for full-page captures.
    Hunchly (hunch.ly) for systematic evidence collection with automatic timestamps.
    A plain folder of dated screenshots is sufficient if nothing else is available.
    
    Reporting pathways by platform:
    - Twitter/X: twitter.com/en/safety/report-abuse — use "targeted harassment" category
    - Meta (Instagram/Facebook): Help Centre → Report → Harassment
    - TikTok: Long-press content → Report
    - YouTube: Three dots → Report
    
    For coordinated campaigns: Platforms have escalated review teams. Use terms
    "coordinated harassment" and "brigading" in reports — these route differently
    than individual content reports. For high-volume campaigns, contact Trust &
    Safety teams directly via email if available (most major platforms have these).
    
    PEN America's Online Harassment Field Manual (onlineharassmentfieldmanual.pen.org)
    has platform-by-platform reporting guides kept current. Use it.
  android: |
    Enable 2-step verification on Google account immediately — harassment campaigns
    often include account takeover attempts.
    Review location history: Settings → Google → Manage your Google Account →
    Data & Privacy → Location History.
    Turn off "Find my device" broadcasting if concerned about location exposure.
  ios: |
    Enable 2FA on Apple ID immediately if not already active.
    Review which apps can access your location and contacts.
    Settings → Privacy & Security → Location Services — audit every app.
    Consider switching to a separate Apple ID for less identifiable accounts.

