id: womens-online-harassment-001
schema_version: 1.0.0
version: 1.1.0
title: Prepare a response plan for targeted online harassment
simple_description: Write down what you would do if someone targets you online.
description: |
  Targeted online harassment campaigns follow recognisable patterns: coordinated
  contact across platforms, public posts designed to amplify, doxxing, and contact
  attempts to employers or family. Having a prepared plan — documentation strategy,
  reporting pathways, privacy hardening steps — before an incident makes response
  faster and more effective. This item helps you build that plan.
threat_narrative: |
  Online harassment campaigns targeting women can escalate from social media attacks
  to physical-world contact within days, especially when home addresses or employer
  information is involved. Platforms' response times are measured in days; by then
  a campaign may have reached thousands of people. The psychological impact of
  sustained harassment is well-documented and severe. A prepared response plan
  doesn't prevent harassment, but it dramatically reduces the time between
  onset and effective action — and preserves the evidence needed for legal remedies.
category: incident_response
subcategory: reporting
tracks:
  - womens_safety
platforms:
  - all
platform_notes:
  all: >-
    Before you start

    Keep the evidence before you block or report anything. Screenshots with the date, the platform
    and the username.

    Once you block, you may lose your access to it.


    Do this

    Decide what you will do now, so you are not deciding it while it is happening.


    Your plan, in order

    Record first. A dated folder of screenshots is enough.

    Lock your accounts.

    These campaigns often arrive with attempts to get into your accounts, so two-step login matters
    more this week than any other.

    Report with the right words. If several accounts are involved say coordinated harassment, not
    just harassment.

    That phrase routes to a different team on most platforms.

    Do not reply. Engagement is what keeps it going.


    Where to get help

    PEN America's Online Harassment Field Manual keeps reporting guides for each platform current.

    onlineharassmentfieldmanual.pen.org

    The Cyber Civil Rights Initiative runs a crisis line: cybercivilrights.org/ccri-safety-center/
