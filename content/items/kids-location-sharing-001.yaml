# PSSAF Checklist Item
# Personal Security Self-Audit Framework — kids_teen track

id: "kids-location-sharing-001"
schema_version: "1.0.0"
version: "1.0.0"

title: "Review which apps can see your child's location"

description: |
  Many games, apps, and social platforms automatically share a device's location
  with other users or store it on remote servers. Children often don't realise this
  is happening. A regular review of which apps have location access — and what they
  do with it — is one of the highest-value privacy habits a guardian can build with
  a young person.

threat_narrative: |
  An adult with harmful intent can use location data shared in a game or app to
  learn where a child lives, goes to school, or spends regular time. Even apps
  marketed specifically for children have exposed location data through poor design
  or undisclosed third-party sharing. Real-world predatory contact has been initiated
  through in-game location features. The risk is not hypothetical — it is documented.

category: "physical_security"
subcategory: "surveillance_awareness"

tracks:
  - "kids_teen"

platforms:
  - "android"
  - "ios"

platform_notes:
  android: |
    Settings → Apps → [App name] → Permissions → Location.
    Set to "Only while using" for navigation apps, "Deny" for games and social apps.
    On Android 12+, you can grant approximate location (less precise) — prefer this
    over precise location for any app that doesn't genuinely need it.
    Check this for every app your child uses, not just obvious ones.
  ios: |
    Settings → Privacy & Security → Location Services.
    Review every app. Set to "Never" for games and social apps.
    Set to "While Using" only for apps that genuinely need it (navigation, weather).
    Disable "Precise Location" toggle where available — approximate is safer.
    Also check: Settings → [Your child's Apple ID] → Find My → Share My Location.

