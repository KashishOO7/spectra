id: data-ecosystem-audit-001
schema_version: 1.0.0
version: 1.1.0
title: Check the privacy settings on the accounts you use most
simple_description: Turn off ad tracking and history in the accounts you use most.
description: >-
  Every big account provider has a privacy dashboard, and most people have never opened theirs.
  Activity history, ad personalisation, location history, voice recordings and AI training settings
  all live there. You will not know what is switched on until you look, and the answer differs by
  company, by country, and by when you made the account.
threat_narrative: >-
  The accounts you sign in with know more about you than any single app, because they see you across
  all of it. Two things follow. Anyone who gets into one of those accounts inherits whatever history
  it holds, not just the login. And whatever is shared onward for advertising is out of your hands
  once it goes. Neither depends on which provider you use, which is why the fix is the same
  everywhere: open the dashboard and see for yourself.
category: data_management
subcategory: data_minimization
tracks:
  - general
platforms:
  - android
  - ios
  - windows
  - macos
  - web
platform_notes:
  all: >-
    Do this

    Open the privacy settings on the accounts you use most, and turn off the collecting you never
    asked for.


    Which ones first

    Start with the accounts you use to log in to other things. Your main email. Your phone account.
    Your social apps.

    Your shopping account. Your games console.


    What to turn off

    Ads picked for you, also called personalised ads, interest-based ads, or ads based on your
    activity.

    History keeping: web and app activity, location history, voice recordings, watch and search
    history. Turn each off, then delete what is already stored, because turning it off does not
    clear it.

    Activity shared between the different products you use under one account.

    Sharing with partners and advertisers.


    Leave these alone

    Sign-in alerts, and your recovery phone number and email. Those are what tells you when someone
    else gets in, so they stay on.


    Test it

    Find the ad settings page in one of them. If it lists interests you never picked, ads are still
    being aimed at you.
