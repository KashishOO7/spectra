id: "data-ecosystem-audit-001"
schema_version: "1.0.0"
version: "1.0.0"
title: "Audit privacy settings on your primary account ecosystems"
description: |
  Google, Microsoft, Apple, and Meta each run a privacy dashboard where dozens
  of data collection toggles are enabled by default. Activity tracking, ad
  personalisation, location history, voice recordings, AI training opt-ins,
  diagnostic telemetry. Most people never open these dashboards. The data
  collected feeds ad networks, trains models, and builds profiles that persist
  even if you delete the app.
threat_narrative: |
  Your account ecosystem knows more about you than any single app. Google
  tracks search history, location, YouTube watches, voice commands, and app
  usage across every Android device. Microsoft collects activity history,
  Cortana recordings, and browsing data through Edge. Apple collects Siri
  transcripts and analytics. Meta builds a shadow profile from your activity
  across Facebook, Instagram, Threads, and WhatsApp metadata. All of this is
  on by default. An attacker who compromises your account inherits this entire
  history. A data broker who buys aggregated ad data gets a slice of it.
