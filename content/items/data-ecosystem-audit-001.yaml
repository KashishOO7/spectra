platform_notes:
  android: |
    YOUR GOOGLE ACCOUNT — myaccount.google.com/privacycheckup

    Walk through Google's Privacy Checkup. Focus on these categories:
    • Web & App Activity — controls search, Maps, Assistant, and app usage tracking.
      Turn off or set to auto-delete (3 months minimum).
    • Location History (Timeline) — tracks everywhere you go. Turn off entirely
      unless you actively use Timeline.
    • YouTube History — watch and search history. Turn off or auto-delete.
    • Ad Personalisation — myaccount.google.com/data-and-privacy → Ad settings.
      Turn off personalised ads.
    • Google AI and Gemini — check for training data opt-ins under Data & Privacy.
    • Device information, Voice & Audio Activity, Chrome history sync — disable
      if you don't actively use these features cross-device.

    Also check: Settings → Google → (all services). Many toggles here are on by
    default including diagnostics, usage stats, and personalised recommendations.
  ios: |
    YOUR APPLE ACCOUNT — Settings → [Your Name] → Privacy & Security

    • Analytics & Improvements — disable Share iPhone Analytics, Improve Siri,
      Share with App Developers.
    • Apple Advertising — Settings → Privacy & Security → Apple Advertising →
      disable Personalised Ads.
    • Siri & Search — review per-app Siri access. Disable "Listen for Hey Siri"
      if you don't use it. Check Siri & Dictation History and delete it.
    • iCloud data — review what syncs. Each synced category is stored on Apple
      servers. Disable sync for data you want to keep local only.
    • Sign in with Apple — review which apps use it. Revoke access for apps you
      no longer use.

    Also check appleid.apple.com for a web view of devices, app-specific
    passwords, and data/privacy requests.
  windows: |
    YOUR MICROSOFT ACCOUNT — account.microsoft.com/privacy

    • Activity History — disable "Store my activity history on this device" and
      cloud sync. Clear existing history.
    • Advertising ID — Settings → Privacy & Security → General → disable all
      four toggles (advertising ID, language list, app launches, suggested content).
    • Diagnostic data — Settings → Privacy & Security → Diagnostics & feedback →
      set to Required only. Disable tailored experiences and improve inking.
    • Speech, Inking, Typing — disable online speech recognition if you don't use
      voice features.
    • Copilot/AI — review any data sharing with Microsoft AI features. Opt out
      of training data contributions.

    Visit privacy.microsoft.com/privacystatement for what Microsoft collects
    and account.microsoft.com/privacy/ad-settings to disable ad personalisation.
  macos: |
    Same Apple account as iOS — see iOS tab for iCloud and Apple ID settings.

    Additional macOS-specific:
    • System Settings → Privacy & Security → Analytics & Improvements — disable
      Share Mac Analytics, Improve Siri.
    • System Settings → Privacy & Security → Apple Advertising → disable.
    • Spotlight Suggestions — System Settings → Siri & Spotlight → disable
      Suggestions in Spotlight if you don't want queries sent to Apple.
  web: |
    YOUR META ACCOUNTS — facebook.com/privacy/checkup and
    accountscenter.instagram.com/info_and_permissions/

    • Ad Preferences — disable ad personalisation, clear ad interest categories,
      turn off activity from partners (off-Meta tracking).
    • Apps and Websites — revoke access for every app you don't actively use.
    • Face recognition — disable if offered.
    • Profile visibility — restrict who can see your friends list, posts, and
      profile details.

    YOUR AMAZON ACCOUNT — amazon.com/privacyprefs

    • Advertising Preferences — disable personalised ads.
    • Alexa Privacy — amazon.com/alexa-privacy → review and delete voice
      recordings. Disable "Help improve Alexa."
    • Browse and search history — clear and disable.

    General principle for ANY account: find Settings → Privacy, turn off
    everything you don't actively use, delete existing history where offered.
