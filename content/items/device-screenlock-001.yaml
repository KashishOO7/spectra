id: "device-screenlock-001"
schema_version: "1.0.0"
version: "2.0.0"
title: "Set a strong screen lock — PIN or passphrase, not biometrics alone"
description: |
  A strong screen lock is your first physical defense. Android patterns are easily 
  reconstructed from fingerprint smudges. A 6+ digit PIN or alphanumeric passphrase is 
  dramatically harder to bypass and is legally protected in ways biometrics are not.
threat_narrative: |
  Repair technicians, thieves, or seizing authorities have time and tools to bypass 
  weak locks. More critically, in many jurisdictions, law enforcement can physically 
  force you to unlock a phone using your fingerprint or face, but cannot legally compel 
  you to reveal a memorized PIN (Fifth Amendment in the US).
category: "device_security"
subcategory: "physical_security"
tracks:
  - "general"
  - "journalist"
platforms:
  - "all"
platform_notes:
  android: "Settings > Security > Screen Lock. Choose PIN (6+ digits) or Password. Avoid Pattern entirely. Enable 'Lockdown Mode' to temporarily disable biometrics during high-risk situations."
  ios: "Settings > Face ID & Passcode > Change Passcode > Passcode Options > Custom Numeric (6+ digits) or Alphanumeric. Learn the SOS shortcut (hold power + volume) to instantly disable Face ID."
  windows: "Settings > Accounts > Sign-in options. Set a strong PIN. Press Win+L whenever stepping away."
  macos: "System Settings > Lock Screen. Require password 'Immediately' after sleep."
