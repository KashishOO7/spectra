id: device-screenlock-001
schema_version: 1.0.0
version: 2.1.0
title: Set a strong screen lock, not just your face or thumb
simple_description: Set a six-digit PIN or longer on your phone, not only a fingerprint.
description: |
  A strong screen lock is your first physical defense. Android patterns are easily 
  reconstructed from fingerprint smudges. A 6+ digit PIN or alphanumeric passphrase is 
  dramatically harder to bypass and is legally protected in ways biometrics are not.
threat_narrative: |
  Repair technicians, thieves, or seizing authorities have time and tools to bypass 
  weak locks. More critically, in many jurisdictions, law enforcement can physically 
  force you to unlock a phone using your fingerprint or face, but cannot legally compel 
  you to reveal a memorized PIN (Fifth Amendment in the US).
category: device_security
subcategory: physical_security
tracks:
  - general
  - journalist
platforms:
  - all
platform_notes:
  all: >-
    Do this

    Set a six digit PIN or a passphrase, not just your face or your thumb.


    Why not only a fingerprint

    Face and fingerprint are convenient, not strong.

    Someone can hold a phone up to your face while you are asleep.

    And in many places you can be made to unlock with a finger far more easily than with a password.


    What to look for

    Security settings, then the passcode or screen lock option. Choose six digits or more, or a
    passphrase.

    Find your phone's emergency shortcut, the one that turns off face and fingerprint until the code
    is typed.

    Practise it once so you can do it without looking.


    Test it

    Use the shortcut. If the phone then asks for the code rather than your face, you have found the
    right one.
environment_notes:
  border_device_inspection: |
    A strong PIN or passphrase is your last line of defence at a border
    checkpoint. Biometric unlocks (fingerprint, face) can be legally compelled
    in many jurisdictions without the same protections as a passcode. Disable
    biometrics before crossing and re-enable afterwards.
