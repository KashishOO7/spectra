id: device-screenlock-001
schema_version: 1.0.0
version: 2.1.0
title: Set a strong screen lock, not just your face or thumb
simple_description: Set a six-digit PIN or longer on your phone, not only a fingerprint.
description: |
  A strong screen lock is your first physical defense. Android patterns are easily 
  reconstructed from fingerprint smudges. A 6+ digit PIN or alphanumeric passphrase is 
  dramatically harder to bypass and is legally protected in ways biometrics are not.
threat_narrative: |
  Repair technicians, thieves, or seizing authorities have time and tools to bypass 
  weak locks. More critically, in many jurisdictions, law enforcement can physically 
  force you to unlock a phone using your fingerprint or face, but cannot legally compel 
  you to reveal a memorized PIN (Fifth Amendment in the US).
category: device_security
subcategory: physical_security
tracks:
  - general
  - journalist
platforms:
  - all
platform_notes:
  all: >-
    Do this

    Set a six digit PIN or a passphrase, not just your face or your thumb.


    Why not only a fingerprint

    Face and fingerprint are convenient, not strong.

    Someone can hold a phone up to your face while you are asleep.

    And in many places you can be made to unlock with a finger far more easily than with a password.


    What to look for

    Security settings, then the passcode or screen lock option. Choose six digits or more, or a
    passphrase.


    The shortcut worth learning

    Both kinds of phone can switch face and fingerprint off on the spot, so the next unlock has to
    be the code. Learn yours now rather than when you need it.

    iPhone: press and hold the side button together with either volume button until the slider
    screen appears, then press Cancel.

    Android: hold the power button and choose Lockdown from the menu. If Lockdown is not on that
    menu, switch it on first under the lock screen settings.

    Practise it once with the phone in your pocket, so you can do it without looking.


    Test it

    Use the shortcut, then try to unlock with your face or your finger. If the phone insists on the
    code instead, you have the right one.
environment_notes:
  border_device_inspection: >-
    Why the code matters more here

    A face or a finger can be used on you while someone else holds the phone. A code has to be
    given by you.

    The law in many countries treats those two differently, and the code is the one with more
    protection behind it.


    What to do

    Switch face and fingerprint off before you reach the checkpoint, using the lockdown shortcut in
    the steps above. Powering the phone fully off does the same thing.

    Turn them back on afterwards if you want them.
