id: "auth-backup-codes-001"
schema_version: "1.0.0"
version: "1.0.0"
title: "Generate and securely store 2FA backup codes"
description: "Backup codes are one-time recovery codes generated when you enable 2FA. If you lose your authenticator device, they are your only way back in. Most people never save them and lose account access permanently."
threat_narrative: "A stolen or broken phone without backup codes means permanent lockout from accounts without recovery options. This happens thousands of times daily. The cost of not having backup codes is losing your account entirely — not a security incident, just a self-inflicted one."
category: "account_security"
subcategory: "recovery"
tracks:
  - "general"
platforms:
  - "all"
platform_notes:
  all: "After enabling 2FA on any service, locate 'backup codes' or 'recovery codes' in security settings. Download them and store in your password manager's secure notes, or print and store physically in a locked location. Never store in email, cloud notes, or screenshots on your phone."
