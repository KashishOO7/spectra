id: auth-backup-codes-001
schema_version: 1.0.0
version: 1.1.0
title: Save your backup codes somewhere you can reach them
simple_description: Write down your account backup codes and keep them somewhere safe.
description: >-
  Backup codes are one-time recovery codes generated when you enable 2FA. If you lose your
  authenticator device, they are your only way back in. Most people never save them and lose account
  access permanently.
threat_narrative: >-
  A stolen or broken phone without backup codes means permanent lockout from accounts without
  recovery options. This happens thousands of times daily. The cost of not having backup codes is
  losing your account entirely — not a security incident, just a self-inflicted one.
category: account_security
subcategory: recovery
tracks:
  - general
platforms:
  - all
platform_notes:
  all: >-
    Do this

    Save the backup codes for your important accounts somewhere you can actually reach.


    Where to find them

    In the security settings of any account with two-step login, look for backup codes or recovery
    codes.


    How they work

    You get a list of them, and each code works once. Cross one off as you use it.

    When you are down to the last one or two, go back to that same screen and generate a fresh list.
    That cancels the old list, so replace whatever you had saved.


    Where to put them

    In your password manager's notes, or printed and kept somewhere safe. Both is better than
    either.

    Not in your email. Not in a note on the same phone that makes the codes.

    If losing the phone is the problem, the answer cannot live on the phone.


    Test it

    Imagine your phone is gone right now. Could you still get into your email? If not, the codes are
    in the wrong place.
