id: data-social-visibility-001
schema_version: 1.0.0
version: 1.1.0
title: Lock down default visibility and sharing on social accounts
simple_description: Set your social profiles so only people you approve can see them.
description: |
  Social platforms default to maximum visibility: public profiles, discoverable
  by phone number and email, visible friend lists, open activity status, and
  "people you may know" features that expose your relationship graph. Each
  default is a data point available to scrapers, stalkers, and OSINT tools.
  Restricting visibility is free, takes minutes per account, and removes you
  from the easiest reconnaissance paths.
threat_narrative: |
  OSINT tools scrape public profiles automatically. A stalker finds your
  new workplace through LinkedIn activity. A scammer clones your identity
  from public photos and friend lists. The "people you may know" feature
  reveals connections you didn't choose to make public, including contacts
  from your phone that the app uploaded without meaningful consent. In
  documented cases, therapists have been suggested to their own patients,
  and abuse survivors to their abusers, through this feature alone.
category: osint_footprint
subcategory: social_media_exposure
tracks:
  - general
  - womens_safety
  - journalist
platforms:
  - web
  - android
  - ios
platform_notes:
  all: >-
    Do this

    Set your social accounts so only people you approve can see you.


    What to change

    Who can see you: your profile, your follower list, your posts and stories. Set each to approved
    contacts, not public.

    Who can find you: turn off being found by phone number or email, and turn off search engine
    listing.

    Who can contact you: limit messages and comments to people you follow.

    Then turn off the app's access to your contacts, so it stops uploading your address book.


    Test it

    Open your own profile in a private window, logged out. What you can see there is what a stranger
    sees.
