id: "data-social-visibility-001"
schema_version: "1.0.0"
version: "1.0.0"
title: "Lock down default visibility and sharing on social accounts"
description: |
  Social platforms default to maximum visibility: public profiles, discoverable
  by phone number and email, visible friend lists, open activity status, and
  "people you may know" features that expose your relationship graph. Each
  default is a data point available to scrapers, stalkers, and OSINT tools.
  Restricting visibility is free, takes minutes per account, and removes you
  from the easiest reconnaissance paths.
threat_narrative: |
  OSINT tools scrape public profiles automatically. A stalker finds your
  new workplace through LinkedIn activity. A scammer clones your identity
  from public photos and friend lists. The "people you may know" feature
  reveals connections you didn't choose to make public, including contacts
  from your phone that the app uploaded without meaningful consent. In
  documented cases, therapists have been suggested to their own patients,
  and abuse survivors to their abusers, through this feature alone.
category: "osint_footprint"
subcategory: "social_media_exposure"
tracks:
  - "general"
  - "womens_safety"
  - "journalist"
platforms:
  - "web"
  - "android"
  - "ios"
platform_notes:
  web: |
    GENERAL PRINCIPLE FOR EVERY SOCIAL ACCOUNT:
    Find Settings → Privacy. Work through each section. The categories below
    appear on nearly every platform under different names.

    WHO CAN SEE YOUR STUFF
    • Profile visibility — restrict to connections only, not public.
    • Friend/follower list — hide from everyone or connections only.
    • Activity status (online now, last seen) — disable.
    • Posts and stories — default to friends/followers only, not public.

    WHO CAN FIND YOU
    • Phone number and email lookup — disable. This is how scrapers match
      your profile to leaked databases.
    • Search engine indexing — disable. Prevents Google from caching your profile.
    • "People you may know" / "Suggested friends" — these features upload your
      contacts and expose mutual connections. Disable or revoke contact access.

    WHO CAN CONTACT YOU
    • Message requests from strangers — restrict or disable.
    • Comment permissions — limit to followers or approved accounts.

    LINKEDIN SPECIFICALLY
    • Settings → Visibility → Profile viewing options → Private mode.
    • Connections visibility → Only you.
    • Activity broadcasts → disable "Share profile updates."
    • Data privacy → disable social, economic, and workplace research.
  android: |
    For app-specific social media settings on Android, the controls are
    usually in the app itself, not in Android Settings.

    Open each social app → Profile → Settings → Privacy/Security.
    Follow the same categories as the Web tab.

    ANDROID-SPECIFIC
    • Revoke Contacts permission from social apps: Settings → Apps →
      [App] → Permissions → Contacts → Deny. This prevents the app from
      uploading your address book for "people you may know" features.
    • Revoke Location permission from social apps unless you actively use
      location-based features (check-ins, nearby friends).
  ios: |
    Same as Android: controls live inside each app, not in iOS Settings.

    iOS-SPECIFIC
    • Settings → [App Name] → disable Contacts access for every social app
      you don't want uploading your address book.
    • Settings → Privacy & Security → Location Services → set each social
      app to "Never" or "While Using."
    • Settings → Privacy & Security → Tracking → disable "Allow Apps to
      Request to Track" globally.
