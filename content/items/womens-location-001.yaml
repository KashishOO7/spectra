legal_notes:
  - jurisdiction: "global"
    note: |
      SAFETY PLANNING NOTE: Before removing yourself from location-sharing with someone who may react
      dangerously to losing access to your location, make a safety plan first.
      Consult a domestic abuse resource in your area before making this change.
      US: National DV Hotline 1-800-799-7233 or text START to 88788.
      UK: National Domestic Abuse Helpline 0808 2000 247.
      Full international directory: stopstalkerware.org/get-help/
