id: "womens-location-001"
schema_version: "1.0.0"
version: "1.0.0"
title: "Audit every app and account that can see your real-time location"
description: "Many apps — including messaging apps, social media, and your phone's built-in account — can share your real-time or recent location with others. In a safe relationship, this is a convenience. In an unsafe one, it is a surveillance tool. A complete location audit means knowing exactly what can see you and having the ability to switch it off instantly."
threat_narrative: "Intimate partner abuse increasingly relies on digital location tracking. Survivors of stalking and domestic abuse consistently report that their location was known to their abuser before physical confrontations — often via Find My, shared Google accounts, or location-sharing features that were enabled with consent that was later withdrawn. You cannot control who can find you if you don't know what's sharing your location. This audit takes 30 minutes and gives you that control back."
category: "physical_security"
subcategory: "device_physical"
tracks:
  - "womens_safety"
  - "general"
platforms:
  - "ios"
  - "android"
platform_notes:
  ios: |
    ⚠ If you are in immediate danger, do not research this on a device that may be monitored.

    Check every location-sharing method:

    1. Find My — who can see your location:
       Open the Find My app → tap People tab → see who you're sharing with → tap a person → Stop Sharing My Location.

    2. Messages location sharing:
       Open any conversation → tap the person's name at the top → if "Stop Sharing Location" appears, you are sharing. Tap it.

    3. Per-app location permissions:
       Settings → Privacy & Security → Location Services → review every single app.
       Set non-essential apps (games, shopping, food delivery) to "Never."
       Set apps you want to use location for to "While Using" — not "Always."

    4. Google Maps (if installed): tap your profile picture → Location Sharing → review who you're sharing with.

    5. Shared Apple ID devices:
       Settings → [Your Name] → scroll down → see all devices. Remove any you don't recognise or no longer use.
  android: |
    ⚠ If you are in immediate danger, do not research this on a device that may be monitored.

    Check every location-sharing method:

    1. Google account location sharing:
       Open Google Maps → tap your profile picture → Location Sharing → see who you're sharing with. Tap a person → Stop.

    2. Google Timeline (location history):
       Google Maps → your profile picture → Your Timeline.
       To disable: Maps → Settings → Personal Content → Location History → turn off.

    3. Per-app location permissions:
       Settings → Privacy → Permission Manager → Location → review each app.
       Set to "Allow only while using" or "Deny" for non-essential apps.

    4. Google account devices:
       myaccount.google.com → Security → Your Devices → remove devices you don't recognise.

    5. Samsung/manufacturer Find My:
       If you use a Samsung device, check findmymobile.samsung.com — sign in and see who has access.
