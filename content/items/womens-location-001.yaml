id: womens-location-001
schema_version: 1.0.0
version: 1.1.0
title: Check every app and account that can see where you are
simple_description: Check which apps and people can see where you are.
description: >-
  Many apps — including messaging apps, social media, and your phone's built-in account — can share
  your real-time or recent location with others. In a safe relationship, this is a convenience. In
  an unsafe one, it is a surveillance tool. A complete location audit means knowing exactly what can
  see you and having the ability to switch it off instantly.
threat_narrative: >-
  Abuse increasingly relies on digital location tracking. Survivors of stalking and domestic abuse
  consistently report that their location was known to their abuser beforehand, often through a
  shared account, a family locator app, or location sharing that was agreed to once and never
  withdrawn. You cannot control who can find you while you do not know what is sharing it. Going
  through this takes half an hour and hands that control back.
category: physical_security
subcategory: device_physical
tracks:
  - womens_safety
  - general
platforms:
  - ios
  - android
platform_notes:
  all: >-
    Before you start

    If you may be in danger, do not do this on a device that might be watched.


    Do this

    Go through everything that can see where you are, and switch off what you did not choose.


    Four places to check

    People you share with. Your phone's find-my-friends feature and your maps app each keep their
    own list. Look at both.

    Apps with location permission. Games, shopping and delivery apps to never. The rest to only
    while using.

    Location history, which is separate from sharing. Your maps app may be keeping a timeline.

    Turn it off, then delete what is already there.

    Devices signed in to your account. Remove anything you do not recognise or no longer use.


    The one people miss

    A shared account shares your location with no app installed at all.

    If someone else knows your account password, none of the settings above will stop them.
