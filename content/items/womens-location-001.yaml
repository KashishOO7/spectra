legal_notes:
  - jurisdiction: global
    note: >
      SAFETY PLANNING NOTE: Before removing yourself from location-sharing with someone who may
      react

      dangerously to losing access to your location, make a safety plan first.

      Consult a domestic abuse resource in your area before making this change.

      If someone close to you may have access to your phone or accounts, a domestic violence

      service in your country can help. Ask for their tech safety team.

      Full international directory: stopstalkerware.org/get-help/
