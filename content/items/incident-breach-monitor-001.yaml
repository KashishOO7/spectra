id: "incident-breach-monitor-001"
schema_version: "1.0.0"
version: "1.0.0"
title: "Set up breach monitoring for your email addresses"
description: "Breach monitoring services alert you when your email address or password appears in a known data breach. This gives you early warning to change compromised credentials before attackers use them — typically weeks or months before you would otherwise know."
threat_narrative: "Most people discover their credentials were breached when their accounts are already compromised. The average time between a breach occurring and an individual discovering their data was exposed is over 200 days. Breach monitoring services index billions of leaked credentials and notify you within days of exposure. Early warning is the difference between rotating a password and recovering a hijacked account."
category: "incident_response"
subcategory: "breach_detection"
tracks:
  - "general"
platforms:
  - "all"
platform_notes:
  all: "Sign up at haveibeenpwned.com with every email address you use — notifications are free. For phone numbers, check if they appear via Google search. Firefox Monitor (monitor.firefox.com) provides similar functionality. For ongoing monitoring of all accounts, some password managers (Bitwarden, 1Password) include breach monitoring built in."
