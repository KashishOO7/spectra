id: incident-breach-monitor-001
schema_version: 1.0.0
version: 1.2.0
title: Set up breach monitoring for your email addresses
simple_description: Sign up to be told when your email turns up in a data leak.
description: >-
  Breach monitoring services alert you when your email address or password appears in a known data
  breach. This gives you early warning to change compromised credentials before attackers use them —
  typically weeks or months before you would otherwise know.
threat_narrative: >-
  Most people discover their credentials were breached when their accounts are already compromised.
  The average time between a breach occurring and an individual discovering their data was exposed
  is over 200 days. Breach monitoring services index billions of leaked credentials and notify you
  within days of exposure. Early warning is the difference between rotating a password and
  recovering a hijacked account.
category: incident_response
subcategory: breach_detection
tracks:
  - general
platforms:
  - all
platform_notes:
  all: >-
    Do this

    Set up an alert so you hear about it when your email turns up in a leak.


    How

    Go to haveibeenpwned.com and put in each address you use. Searching is free, needs no account,
    and tells you which known leaks already include you.

    Searching does not sign you up for anything. Being told about future leaks is a separate step:
    use the notify option on the same site, give the address, and click the link in the mail it
    sends you. Repeat it for each address, because one signup covers one address.

    Many password managers run the same check on the accounts they hold, so look there too if you
    use one.


    When one arrives

    Change that password, then change it anywhere else you used the same one.

    The second part is the part people skip, and it is the part that matters.


    Test it

    Search an address you have had for years. Most turn up in something, and that is rather the
    point.
