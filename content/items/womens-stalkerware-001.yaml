id: womens-stalkerware-001
schema_version: 1.0.0
version: 1.1.0
title: Check your devices for hidden tracking apps
simple_description: Check your phone for apps you did not install.
description: >-
  Stalkerware is software installed on a device without the owner's knowledge to monitor their
  location, messages, calls, and photos. Unlike malware from outside attackers, it is typically
  installed by someone the victim knows and trusts — often a current or former intimate partner —
  during brief unsupervised access to an unlocked device.
threat_narrative: >-
  Stalkerware gives an abusive person real-time access to every message, call, location, and photo
  on your device, often without triggering any visible notification. Victims frequently don't know
  it's installed for months or years. It is commonly installed when you briefly hand your phone to
  someone, leave it unlocked, or share your account credentials. Detection is hard because
  stalkerware is specifically designed to be invisible. The presence of stalkerware does not mean
  you are in immediate danger — but it does mean someone has decided to surveil you without your
  knowledge.
category: device_security
subcategory: malware_protection
tracks:
  - womens_safety
platforms:
  - android
  - ios
platform_notes:
  all: >-
    Before you start

    If you think you may be in danger, do not look into this on the device you suspect.

    Use a friend's phone, or a computer at a library.

    Someone watching a phone can see it being read.


    Do this

    Look for apps you did not install, and for permissions that give an app more reach than it
    needs.


    What to look for

    Apps you do not recognise. Look at the full list, not the home screen, because anything meant
    to hide will not have an icon there. On iPhone: Settings, then General, then iPhone Storage. On
    Android: Settings, then Apps, then See all apps, and turn on show system apps in the menu.

    Anything holding accessibility permission that you did not grant.

    That permission is how an app reads your messages, so it is the one these tools nearly always
    ask for.

    Anything registered as a device administrator, which is how they resist being deleted.

    A device management or work profile you did not set up.

    And a shared account, which is the most common route of all, and needs no app at all.


    Do not rush to delete it

    Removing it tells whoever installed it that you know.

    If that person could become dangerous, talk to a domestic abuse service before you change
    anything.

    They handle this every day and will help you plan the order.

    The Coalition Against Stalkerware lists organisations that can help: stopstalkerware.org
