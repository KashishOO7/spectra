legal_notes:
  - jurisdiction: "global"
    note: |
      SAFETY PLANNING NOTE: If you believe you are being monitored and you are in an unsafe situation,
      do not remove stalkerware without a safety plan. Removing it may alert the person monitoring you,
      which could escalate danger. Contact a domestic abuse resource or the Coalition Against Stalkerware
      (stopstalkerware.org) for guidance before taking action.
      Your physical safety comes before your device security.
  - jurisdiction: "global"
    note: "Installing monitoring software on another person's device without their knowledge or consent is illegal in most jurisdictions."
