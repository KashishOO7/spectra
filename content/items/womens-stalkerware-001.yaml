id: "womens-stalkerware-001"
schema_version: "1.0.0"
version: "1.0.0"
title: "Check your devices for stalkerware and covert tracking apps"
description: "Stalkerware is software installed on a device without the owner's knowledge to monitor their location, messages, calls, and photos. Unlike malware from outside attackers, it is typically installed by someone the victim knows and trusts — often a current or former intimate partner — during brief unsupervised access to an unlocked device."
threat_narrative: "Stalkerware gives an abusive person real-time access to every message, call, location, and photo on your device, often without triggering any visible notification. Victims frequently don't know it's installed for months or years. It is commonly installed when you briefly hand your phone to someone, leave it unlocked, or share your account credentials. Detection is hard because stalkerware is specifically designed to be invisible. The presence of stalkerware does not mean you are in immediate danger — but it does mean someone has decided to surveil you without your knowledge."
category: "device_security"
subcategory: "malware_protection"
tracks:
  - "womens_safety"
platforms:
  - "android"
  - "ios"
platform_notes:
  android: |
    ⚠ SAFETY FIRST: If you think you may be in danger, do not research this on the device you suspect is monitored. Use a trusted friend's phone, a library computer, or a brand new incognito session on a different device.

    Signs stalkerware may be present: battery draining faster than normal, mobile data usage spiking, device warm when idle, unfamiliar apps in the app list.

    How to check:
    1. Settings → Apps (or Application Manager) → Show all / Show system apps → scroll through. Look for anything you don't recognise.
    2. Settings → Accessibility → Downloaded Apps — stalkerware almost always requests Accessibility permissions because that's how it reads messages. Remove anything you didn't install.
    3. Settings → Battery → Battery Usage — look for apps using battery in the background that you don't use or recognise.
    4. Settings → Device Admin Apps — stalkerware may register as a device administrator to resist uninstall. Remove it here before uninstalling.

    Safest resolution: factory reset. Only do this if it is safe to do so — see the safety planning note in legal_notes.

    For guided help: Coalition Against Stalkerware (stopstalkerware.org) has vetted resources and can connect you with support organisations.
  ios: |
    ⚠ SAFETY FIRST: If you think you may be in danger, do not research this on the device you suspect is monitored.

    iOS is more resistant to stalkerware than Android, but surveillance still happens via:

    1. iCloud account access — if someone knows your Apple ID and password, they can see your iCloud backups, location, messages synced to iCloud, and Photos.
       Fix: Settings → [Your Name] → Password & Security → Change Password. Then sign out all other devices: Settings → [Your Name] → scroll down → tap each device → Remove from Account.

    2. MDM (Device Management) profile — an abuser with brief access can install a monitoring profile.
       Check: Settings → General → VPN & Device Management → look for any profile you didn't install yourself. Delete it.

    3. Shared Apple ID — if you share an Apple ID with someone, they can see your location, messages, and purchases.
       Fix: set up your own independent Apple ID.

    4. Find My — check who can see your location: Settings → [Your Name] → Find My → Share My Location → see the list in the Find My app under People.
