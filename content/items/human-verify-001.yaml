id: human-verify-001
schema_version: 1.0.0
version: 2.1.0
title: Always verify requests through an independent channel
simple_description: Call the person back on a number you already have.
description: |
  When anyone contacts you requesting action — transferring money, providing credentials, 
  or clicking a link — verify their identity using an independent channel. Do not use the 
  contact info provided in the suspicious message.
threat_narrative: |
  Business email compromise and AI-driven impersonation cost billions annually. Attackers 
  rely on you accepting the context they provide. A phishing site can be a pixel-perfect 
  replica. The verification step is the entire defense. It costs 2 minutes and defeats 
  multi-million dollar attack infrastructure.
category: human_vulnerability
subcategory: social_engineering_defense
tracks:
  - general
  - corporate
platforms:
  - all
platform_notes:
  all: >-
    Do this

    Check any request that matters by going back a different way than it came.


    How

    A call: hang up. Find the number yourself, on your card or the company's own site, and ring
    back.

    A message: do not use its link. Type the address in yourself and sign in as normal.

    A request from someone you know: reach them on something else. Ring them, or use a different
    app.


    Why it works

    Whoever sent it controls only the way it arrived. They cannot control the number you already
    had.


    Test it

    Try it once on something real and harmless, like a delivery notice. Getting used to it while
    nothing is at stake is the point.
