id: "human-verify-001"
schema_version: "1.0.0"
version: "2.0.0"
title: "Always verify requests through an independent channel"
description: |
  When anyone contacts you requesting action — transferring money, providing credentials, 
  or clicking a link — verify their identity using an independent channel. Do not use the 
  contact info provided in the suspicious message.
threat_narrative: |
  Business email compromise and AI-driven impersonation cost billions annually. Attackers 
  rely on you accepting the context they provide. A phishing site can be a pixel-perfect 
  replica. The verification step is the entire defense. It costs 2 minutes and defeats 
  multi-million dollar attack infrastructure.
category: "human_vulnerability"
subcategory: "social_engineering_defense"
tracks:
  - "general"
  - "corporate"
platforms:
  - "all"
platform_notes:
  all: |
    THE VERIFICATION RULES:
    1. Phone Calls: Hang up. Look up the official number on the back of your bank card 
       or the official website. Call them back.
    2. Emails: Check the actual sender domain in the email headers, not just the display name. 
       Do not click links; manually navigate to the service's website in your browser.
    3. 'CEO/Boss Requests': Corporate policy should require a secondary channel (e.g., a 
       Slack message or phone call) for any sudden financial or data request.
