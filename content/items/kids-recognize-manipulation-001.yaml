id: kids-recognize-manipulation-001
schema_version: 1.0.0
version: 1.1.0
title: Teach your child to recognise online manipulation red flags
simple_description: Tell your child that secrets, gifts and private chats are warning signs.
description: |
  Manipulation of children online follows recognisable patterns: requests for secrets,
  gift-giving, moving to private platforms, and gradual escalation of intimacy or requests.
  Children who know these patterns can name them when they meet them, and know that
  telling a trusted adult is the right response rather than a source of trouble.
threat_narrative: |
  Adults who target children online usually start by building trust, with games, compliments
  and steady attention, before escalating towards photos, location or private contact.
  Secrecy is one of the levers they rely on. Conversations are often moved off the platform
  where they started onto a private messaging app, where there is less chance of being seen.
  A child who has never had these patterns named often does not recognise them while they
  are happening, which is the reason for naming them in advance.
category: human_vulnerability
subcategory: social_engineering_defense
tracks:
  - kids_teen
platforms:
  - all
platform_notes:
  all: >-
    Do this

    Teach your child the four moves that adults who mean harm make, so they see them coming.


    The four

    Secrets. Anyone asking them to keep a friendship from you is the problem, whatever else they
    seem to be.

    Gifts. Game credits, skins, money. A present that arrives with a request attached is not a
    present.

    Moving somewhere private. Starting in a game or a comment, then asking to move to a chat where
    nobody else can see.

    Small steps. Each ask slightly bigger than the last, so no single one feels like the moment to
    stop.


    How to put it

    Tell them plainly that they will never be in trouble for telling you, however far it went.

    That sentence is the whole thing, because shame is what keeps a child quiet.


    Test it

    Ask them what they would do if someone online asked them to keep a secret. Their answer tells
    you where to start.
