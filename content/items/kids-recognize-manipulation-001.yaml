      Educational guidance only. If a child discloses that they have been contacted
      inappropriately online, contact local law enforcement and a qualified child
      protection professional. This framework provides awareness education only.
      Report suspected online exploitation to your national reporting centre
      (NCMEC in the US, IWF in the UK, CEOP in the UK, INHOPE internationally).
