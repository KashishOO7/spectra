# PSSAF Checklist Item
# Personal Security Self-Audit Framework — womens_safety track
#
# Content review note: This item covers non-consensual intimate imagery (NCII).
# Framing is prevention-focused and resource-forward, not shame-inducing.
# Written to inform and empower, not to assign responsibility for abuse.
# Reviewed for trauma-informed language before publication.

id: "womens-image-abuse-001"
schema_version: "1.0.0"
version: "1.0.0"

title: "Understand your options for preventing and responding to image-based abuse"

description: |
  Non-consensual intimate imagery (NCII) — sharing or threatening to share intimate
  images without consent — is a form of abuse, not a consequence of sharing. This item
  covers both proactive steps that reduce exposure and response pathways if images
  are shared without your consent. Prevention tools and reporting mechanisms have
  improved significantly in recent years.

threat_narrative: |
  NCII is used as a tool of control, coercion, and harassment. In many cases it is
  threatened rather than carried out, as the threat itself causes significant harm.
  AI tools now make it possible to generate synthetic intimate images of real people
  without any original intimate content existing — meaning this risk is no longer
  limited to situations where images were previously shared. The impact on targets
  includes loss of employment, severe psychological harm, and secondary harassment
  campaigns. Response pathways exist and are increasingly effective when acted on quickly.

category: "data_management"
subcategory: "data_deletion"

tracks:
  - "womens_safety"

platforms:
  - "all"

platform_notes:
  web: |
    StopNCII.org: Creates a hash of your intimate images that participating platforms
    (Meta, TikTok, Snap, Bumble, OnlyFans, and others) use to proactively detect and
    remove matching content. You never upload the image — only a fingerprint.
    Use this proactively, not only after an incident.
    
    Meta's "Take It Down" (takeitdown.ncmec.org): For under-18s specifically.
    Similar hash-based approach for Meta platforms (Facebook, Instagram, Messenger).
    
    Google Image Removal: Search Console → Remove Outdated Content, or
    support.google.com/websearch/troubleshooter/9685456 for non-consensual intimate
    images specifically — Google has an expedited removal process.
    
    Bing NCII removal: microsoft.com/en-us/concern/bing
  android: |
    Google Photos: Settings → Manage Storage → check backup settings.
    If intimate images are stored, review who has account access and whether
    Google account recovery options could grant an abuser access.
    Disable automatic backup of intimate images if preferred:
    Google Photos → Library → Utilities → Manage device folders.
  ios: |
    iCloud Photos: Settings → [Your Name] → iCloud → Photos.
    If intimate images sync to iCloud, review who has access to your Apple ID.
    Enable Advanced Data Protection (Settings → Privacy & Security → Advanced Data Protection)
    to ensure end-to-end encryption of iCloud Photo Library.
    Disable shared album access and review who is in your Family Sharing group.

