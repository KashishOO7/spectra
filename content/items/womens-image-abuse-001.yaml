id: womens-image-abuse-001
schema_version: 1.0.0
version: 1.1.0
title: Know your options if an intimate image is shared without consent
simple_description: Learn how to get intimate images taken down if someone shares them.
description: |
  Non-consensual intimate imagery (NCII) — sharing or threatening to share intimate
  images without consent — is a form of abuse, not a consequence of sharing. This item
  covers both proactive steps that reduce exposure and response pathways if images
  are shared without your consent. Prevention tools and reporting mechanisms have
  improved significantly in recent years.
threat_narrative: |
  NCII is used as a tool of control, coercion, and harassment. In many cases it is
  threatened rather than carried out, as the threat itself causes significant harm.
  AI tools now make it possible to generate synthetic intimate images of real people
  without any original intimate content existing — meaning this risk is no longer
  limited to situations where images were previously shared. The impact on targets
  includes loss of employment, severe psychological harm, and secondary harassment
  campaigns. Response pathways exist and are increasingly effective when acted on quickly.
category: data_management
subcategory: data_deletion
tracks:
  - womens_safety
platforms:
  - all
platform_notes:
  all: >-
    Before you start

    You have done nothing wrong, and there are people whose whole job is this.


    Do this

    You can have intimate images blocked across many platforms without sending anyone the image.


    How that works

    StopNCII.org turns the picture into a fingerprint on your own device and sends only the
    fingerprint.

    Many large platforms use it to find and block matching uploads.

    The picture itself never leaves your phone.

    Do it before anything is shared, not only afterwards. It works either way.

    For anyone under 18, takeitdown.ncmec.org does the same thing.


    Also

    Search engines run their own removal request, separate from the platforms, so a picture can be
    taken out of search results while it is still sitting on a site. Search the engine's own name
    together with remove personal information to reach its form.

    Keep dated screenshots of anything already posted, before you report it. Reporting often makes
    the post vanish, and the proof of what was there goes with it.


    Where to get help

    The Cyber Civil Rights Initiative runs a crisis line and lists international resources:
    cybercivilrights.org/ccri-safety-center/
