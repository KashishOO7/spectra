legal_notes:
  - jurisdiction: "global"
    note: |
      NCII is illegal in many jurisdictions. This is an educational resource only —
      not legal advice. If you are experiencing NCII or threats of NCII, the Cyber
      Civil Rights Initiative (cybercivilrights.org) operates a crisis helpline:
      +1-844-878-2274 (US) and provides international resources. Document everything
      before taking action — screenshots with timestamps, platform names, and any
      identifying information about the perpetrator. A qualified attorney can advise
      on civil and criminal options in your jurisdiction.
  - jurisdiction: "GB"
    note: |
      In England and Wales, sharing intimate images without consent is a criminal
      offence under the Online Safety Act 2023. Threats to share are also criminalised.
      Report to police and to the Internet Watch Foundation (iwf.org.uk).
  - jurisdiction: "AU"
    note: |
      Australia's eSafety Commissioner (esafety.gov.au) has legal powers to compel
      removal of NCII and synthetic NCII. File a report at esafety.gov.au/report.

