id: "kids-oversharing-001"
schema_version: "1.0.0"
version: "1.0.0"
title: "Learn the 5 things that should never appear in public posts"
description: "Five categories of personal information are consistently used by scammers, predators, and bullies when found in public posts: your school or workplace, your home neighbourhood, your daily routine or schedule, your phone number, and photos that contain location data. Treating these as always-private is a simple habit that dramatically reduces risk."
threat_narrative: "A post like 'First day at [school name]!' with a location-tagged photo gives a stranger your school, your face, and your friend group — enough to approach you convincingly. Posts about routines ('gym every Monday 6pm') create predictability that can be exploited for physical or online targeting. Small, innocent-seeming details combine into a picture that's much more than the sum of its parts. Most people who have been targeted online say it started with information they shared publicly and assumed nobody would misuse."
category: "human_vulnerability"
subcategory: "information_oversharing"
tracks:
  - "kids_teen"
platforms:
  - "all"
platform_notes:
  all: |
    THE FIVE RULES — apply to public posts, stories, and profiles:

    1. School or workplace name — never post publicly. Mention it only in direct messages to people you already know.

    2. Home neighbourhood or street — never post. If you tag locations, use the general city, not your area.

    3. Daily schedule or routine — vary how you describe plans. "going to a sports thing" is fine; "football practice every Tuesday at 6 at Riverside Park" is not.

    4. Phone number — never post publicly. Share only in DMs to people you actually know and trust.

    5. Location-revealing photos — turn off location on your camera.
       iPhone: Settings → Privacy & Security → Location Services → Camera → Never.
       Android: Open Camera app → Settings → disable "Save Location" or "GPS tag."

    Before posting anything: "Would I be OK if a stranger I don't like saw this?"
    If not — don't post it publicly.
