id: kids-oversharing-001
schema_version: 1.0.0
version: 1.1.0
title: Learn the 5 things that should never appear in public posts
simple_description: Keep your school, address and daily routine out of public posts.
description: >-
  Five categories of personal information are consistently used by scammers, predators, and bullies
  when found in public posts: your school or workplace, your home neighbourhood, your daily routine
  or schedule, your phone number, and photos that contain location data. Treating these as
  always-private is a simple habit that dramatically reduces risk.
threat_narrative: >-
  A post like 'First day at [school name]!' with a location-tagged photo gives a stranger your
  school, your face, and your friend group — enough to approach you convincingly. Posts about
  routines ('gym every Monday 6pm') create predictability that can be exploited for physical or
  online targeting. Small, innocent-seeming details combine into a picture that's much more than the
  sum of its parts. Most people who have been targeted online say it started with information they
  shared publicly and assumed nobody would misuse.
category: human_vulnerability
subcategory: information_oversharing
tracks:
  - kids_teen
platforms:
  - all
platform_notes:
  all: >-
    Do this

    Keep five things out of anything public.

    Their school, their street, their daily routine, their phone number, and photos in school
    uniform.


    Why those five

    Each one turns "a kid on the internet" into "that kid, there, at half past three". On their own
    they look harmless.

    Together they are a map.


    How to put it

    Not "stop posting".

    Say: anything that tells a stranger where to find you goes in messages to people you know, never
    on your profile.


    Test it

    Look at their last ten public posts the way a stranger would. Could you work out which school?
    If yes, start there.
