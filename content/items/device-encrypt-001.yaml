  - macos
  - linux
  - android
  - ios
platform_notes:
  all: >-
    Do this

    Turn encryption on, so a lost or stolen device cannot be read.


    What to look for

    Phones: usually on already if you have a screen lock. Check under security settings for
    Encryption.

    Computers: look for Device encryption, BitLocker, or FileVault. Turn it on if it is off.


    The part people get wrong

    Save the recovery key somewhere you can reach without that computer. In your password manager,
    or on paper.

    Not only on the machine it unlocks.


    Test it

    Turn the device fully off, then on again.

    If it wants your PIN or password before it will start, not just at the lock screen, encryption
    is doing its job.
environment_notes:
  border_device_inspection: |
    At border crossings, authorities may compel you to unlock your device.
    Encryption protects data if the device is seized without your cooperation,
    but cannot protect against lawful compelled decryption. Consider travelling
    with a clean device and accessing sensitive data remotely, or enabling a
    separate travel PIN distinct from your standard passphrase.
