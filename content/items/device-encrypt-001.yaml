  - "linux"
  - "android"
  - "ios"
platform_notes:
  windows: "Settings > Privacy & Security > Device Encryption. If you have Windows Pro, use BitLocker (Control Panel > System and Security). Ensure your recovery key is backed up to a local password manager, not just Microsoft's cloud."
  macos: "System Settings > Privacy & Security > FileVault > Turn On. Choose to create a recovery key rather than using your iCloud account to unlock the disk."
  linux: "Use LUKS (Linux Unified Key Setup) during OS installation. Post-install encryption requires advanced terminal usage and data backup."
  android: "Modern Android devices (10+) are encrypted by default. Verify in Settings > Security > Encryption & Credentials."
  ios: "iPhones are hardware-encrypted by default, but this relies entirely on your passcode. Set a strong, 6+ digit alphanumeric passcode to fortify the encryption."
