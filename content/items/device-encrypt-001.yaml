platform_notes:
  all: >-
    Do this

    Turn encryption on, so a lost or stolen device cannot be read.


    What to look for

    Phones: usually on already if you have a screen lock. Check under security settings for
    Encryption.

    Computers: look for Device encryption, BitLocker, or FileVault. Turn it on if it is off.


    The part people get wrong

    Save the recovery key somewhere you can reach without that computer. In your password manager,
    or on paper.

    Not only on the machine it unlocks.


    Test it

    Go back to the same setting and read what it says.

    Phones: the security screen should say encrypted.

    Windows: Device encryption, or BitLocker, should say On for the drive Windows is installed on.

    Mac: FileVault should say On.

    Do not judge this by the start-up screen. On most computers encryption is on and starting up
    looks exactly the same as it always did.
environment_notes:
  border_device_inspection: >-
    What encryption covers here, and what it does not

    Encryption protects what is on a device that is taken from you. It protects nothing on a device
    you have been made to unlock.

    In many countries officers at a crossing can require you to unlock, and what happens if you
    refuse differs by country and by whether you are a citizen of it.


    What actually helps

    Travel with less on the device. That is the only protection here that does not depend on what
    you are asked to do.

    Power the device fully off before you arrive, so the first unlock has to be your code rather
    than your face or your finger.
