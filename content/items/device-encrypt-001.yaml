id: "device-encrypt-001"
schema_version: "1.0.0"
version: "2.0.0"
title: "Enable full-disk encryption on all devices"
description: |
  Full-disk encryption (FDE) scrambles your device's storage so it is unreadable 
  without your encryption key or password. If a device is stolen or seized, the data 
  remains mathematically inaccessible.
threat_narrative: |
  An unencrypted laptop left in a car or seized at a border is a catastrophic data breach. 
  Attackers can bypass the OS entirely, booting from a USB drive to extract passwords, 
  session tokens, and sensitive files in minutes. FDE nullifies physical access as an 
  attack vector for data extraction.
category: "device_security"
subcategory: "encryption"
tracks:
