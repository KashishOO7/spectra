id: ai-voice-clone-001
schema_version: 1.0.0
version: 1.2.0
title: Establish a family safe word to defeat AI voice cloning
simple_description: Agree on a secret word with your family to check a caller is real.
description: |
  AI tools can convincingly clone a voice using just 30 seconds of audio scraped from 
  TikTok, YouTube, or voicemails. Establishing a pre-agreed secret word with your inner 
  circle allows you to instantly verify identity during emergencies.
threat_narrative: |
  Deepfake audio is heavily utilized in "virtual kidnapping" and "grandparent scams," 
  where attackers spoof a loved one's phone number and clone their voice to demand 
  immediate financial help. Without a cryptographic or shared-secret verification method, 
  these attacks bypass human intuition entirely.
category: ai_threats
subcategory: voice_clone_defense
tracks:
  - general
  - ai_focused
platforms:
  - all
platform_notes:
  all: >-
    Do this

    Agree a word with your family that a caller has to say if they ring claiming to be in trouble.


    Setting it up

    Agree it in person, or in an encrypted chat. Not over an ordinary call, and not by text.

    Pick something plain that would never come up by itself. Not a birthday, not a pet, nothing
    anyone could look up.


    When to use it

    Any call where someone sounds like family and needs money or help right now. Ask for the word. A
    real relative manages it.

    A copied voice does not.


    Worth knowing

    A few seconds of speech from anywhere public is enough to copy a voice now. Sounding right
    stopped being proof.
