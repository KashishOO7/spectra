id: ai-voice-clone-001
schema_version: 1.0.0
version: 1.2.0
title: Establish a family safe word to defeat AI voice cloning
simple_description: Agree on a secret word with your family to check a caller is real.
description: |
  AI tools can convincingly clone a voice using just 30 seconds of audio scraped from 
  TikTok, YouTube, or voicemails. Establishing a pre-agreed secret word with your inner 
  circle allows you to instantly verify identity during emergencies.
threat_narrative: |
  Deepfake audio is heavily utilized in "virtual kidnapping" and "grandparent scams," 
  where attackers spoof a loved one's phone number and clone their voice to demand 
  immediate financial help. Without a cryptographic or shared-secret verification method, 
  these attacks bypass human intuition entirely.
category: ai_threats
subcategory: voice_clone_defense
tracks:
  - general
  - ai_focused
platforms:
  - all
platform_notes:
  all: >-
    Do this

    Agree a word with your family that a caller has to say if they ring claiming to be in trouble.


    Setting it up

    Agree it face to face if you can. If not, use a chat app that encrypts messages. Not over an
    ordinary phone call, and not by text.

    Pick a word that is easy to say but would never come up in that conversation by itself, like a
    fruit or a piece of furniture. Not a birthday, not a pet's name, nothing a stranger could look
    up or guess from what your family posts.


    When to use it

    Any call where someone sounds like family and needs money or help right now.

    Ask them to say the word. Never say it first, and never ask "is it still such and such", because
    that hands the word straight to whoever is on the line.

    A real relative can tell you the word. A copied voice cannot.

    If they cannot say it, that on its own does not prove they are fake, because a frightened person
    forgets things. Hang up anyway and ring them back on the number you already have for them.


    Worth knowing

    A few seconds of speech from anywhere public is enough to copy a voice now. Sounding right
    stopped being proof.
