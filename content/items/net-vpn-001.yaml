id: net-vpn-001
schema_version: 1.0.0
version: 1.1.0
title: Use a VPN you have checked on networks you do not trust
simple_description: Use a VPN app to hide your activity on wifi in cafes and hotels.
description: >-
  A VPN encrypts all traffic between your device and the VPN server, hiding your activity from your
  ISP and anyone on the same network. On public WiFi — cafes, airports, hotels — this is essential.
  At home, it shifts trust from your ISP to the VPN provider, which is a trade-off worth
  understanding.
threat_narrative: >-
  Public WiFi is fundamentally untrusted. Anyone on the same network can observe unencrypted traffic
  and attempt man-in-the-middle attacks on encrypted connections. ISPs log DNS queries and
  connection metadata even when HTTPS is used. A VPN on public networks is not optional for anyone
  handling sensitive information — it is the minimum viable protection.
category: network_security
subcategory: vpn
tracks:
  - general
  - journalist
platforms:
  - all
platform_notes:
  all: >-
    Do this

    Turn on a VPN when you are using wifi you do not control, like a cafe, hotel or airport.


    What it does, and what it does not

    It stops the network you are on from seeing which sites you visit.

    It does not make you anonymous, and it hands that view to the VPN company instead.


    Picking one

    Because the view moves rather than disappears, the choice is the whole decision. Use the checks
    on this page, under how to judge a tool before you trust it, and weigh one of them heaviest:
    whether someone independent has published an audit of what the company keeps. A company saying
    it keeps no records is not the same as anyone having checked.

    Be wary of free ones as a category. Running this costs real money, so where nobody is paying,
    the traffic is usually what pays.


    While you are in there

    Turn on the always-on or kill switch setting, so nothing slips out if the VPN drops.


    Test it

    Turn it on, then search the web for what is my IP and open any result. If the country it shows
    is the one you picked rather than the one you are sitting in, it is working.
environment_notes:
  vpn_restricted: >-
    Check the law before you subscribe

    Where you live, only approved providers may be allowed, and using one that is not approved may
    be against the law, or may simply get noticed.

    Find out what applies to you before you sign up rather than after. This is one of the few steps
    on your list that can carry a legal cost.


    If they are blocked where you are

    There are other ways to route around a block, but they are more noticeable rather than less,
    and somewhere VPNs are controlled that visibility is the whole risk.

    So weigh whether you need this step at all. The rest of your list protects you without it.
  govt_monitors_traffic: >-
    Where the trust goes

    A VPN moves the view of your traffic from the company providing your internet to the VPN
    company. It does not make you anonymous.

    So where traffic is watched closely, the only question that matters is what the VPN company
    keeps, and whether anyone outside it has checked.


    What to look for

    An audit by an outside firm, with the findings published. A company saying it keeps no records
    is not the same as anyone having confirmed it.

    A way to pay that is not tied to your name, if that matters where you are.

    The guide on this page lists current providers and what each one says it keeps.
