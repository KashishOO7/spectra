id: "net-vpn-001"
schema_version: "1.0.0"
version: "1.0.0"
title: "Use a verified, no-log VPN on untrusted networks"
description: "A VPN encrypts all traffic between your device and the VPN server, hiding your activity from your ISP and anyone on the same network. On public WiFi — cafes, airports, hotels — this is essential. At home, it shifts trust from your ISP to the VPN provider, which is a trade-off worth understanding."
threat_narrative: "Public WiFi is fundamentally untrusted. Anyone on the same network can observe unencrypted traffic and attempt man-in-the-middle attacks on encrypted connections. ISPs log DNS queries and connection metadata even when HTTPS is used. A VPN on public networks is not optional for anyone handling sensitive information — it is the minimum viable protection."
category: "network_security"
subcategory: "vpn"
tracks:
  - "general"
  - "journalist"
platforms:
  - "all"
platform_notes:
  android: "Mullvad VPN and Proton VPN have first-class Android apps. Enable 'Always-on VPN' in Settings > Network > VPN to prevent leaks when VPN drops."
  ios: "Mullvad and Proton VPN on App Store. Enable 'Connect On Demand' in VPN settings for automatic protection."
  windows: "Mullvad or Proton VPN desktop apps. Enable kill switch to block traffic if VPN drops. Test for DNS leaks at dnsleaktest.com."
  macos: "Same as Windows. Mullvad app has a built-in firewall kill switch. Test after setup."
  linux: "Mullvad has a Linux CLI and GUI. Proton VPN supports Linux. WireGuard is available for manual configuration with any provider."
