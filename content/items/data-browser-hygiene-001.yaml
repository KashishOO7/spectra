id: data-browser-hygiene-001
schema_version: 1.0.0
version: 2.1.0
title: Stop your browser being followed from site to site
simple_description: Add a tracker blocker to your web browser.
description: |
  Your browser is the primary lens through which you interact with the internet, and 
  default settings allow cross-site tracking, third-party cookies, and fingerprinting. 
  Changing your browser or installing a wide-spectrum content blocker drastically 
  reduces passive data collection.
threat_narrative: |
  The average webpage loads resources from 10-30 third-party domains. These trackers 
  build long-term profiles of your behavior, which are sold to data brokers and used in 
  highly targeted phishing attacks. Browser fingerprinting (collecting hardware/software 
  configurations) uniquely identifies you even without cookies.
category: data_management
subcategory: data_minimization
tracks:
  - general
platforms:
  - web
platform_notes:
  all: >-
    Do this

    Turn your browser's tracking protection up to its strictest setting, then add a content blocker.


    Where to look

    Settings, then Privacy. Browsers call it tracking protection, content blocking, or prevent
    cross-site tracking. Choose the strictest setting offered.


    Adding a content blocker

    A content blocker is a small add-on you install into the browser itself, from the browser's own
    add-ons or extensions page. On a computer that page sits under Settings. On a phone, only some
    browsers allow add-ons at all.

    The guide below lists current ones. Install one, not several. They do the same job, and stacking
    them breaks more sites without blocking more.


    If a site breaks

    Turn protection down for that one site rather than switching it off everywhere.


    Test it

    Run Cover Your Tracks at coveryourtracks.eff.org.

    It is free, needs no account, and is run by the Electronic Frontier Foundation.

    It tells you whether trackers are being blocked and how easy your browser is to recognise.
