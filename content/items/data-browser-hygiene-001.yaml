id: "data-browser-hygiene-001"
schema_version: "1.0.0"
version: "2.0.0"
title: "Harden your browser and reduce tracking surface"
description: |
  Your browser is the primary lens through which you interact with the internet, and 
  default settings allow cross-site tracking, third-party cookies, and fingerprinting. 
  Changing your browser or installing a wide-spectrum content blocker drastically 
  reduces passive data collection.
threat_narrative: |
  The average webpage loads resources from 10-30 third-party domains. These trackers 
  build long-term profiles of your behavior, which are sold to data brokers and used in 
  highly targeted phishing attacks. Browser fingerprinting (collecting hardware/software 
  configurations) uniquely identifies you even without cookies.
category: "data_management"
subcategory: "data_minimization"
tracks:
  - "general"
platforms:
  - "web"
platform_notes:
  web: |
    TIER 1 — Standard Protection (Best for most users)
    Switch to a privacy-respecting browser with a strong content blocker.
    • Firefox + uBlock Origin: The gold standard. uBlock Origin on Firefox is not 
      hamstrung by Chrome's Manifest V3 limitations. Enable "Strict" tracking protection.
    • Brave Browser: Chromium-based alternative with excellent out-of-the-box tracker 
      blocking. Good if you absolutely require Chrome extension compatibility.

    TIER 2 — Advanced Anti-Fingerprinting (High threat models)
    For users needing to blend in and defeat advanced tracking scripts.
    • Mullvad Browser: Built in collaboration with Tor, designed to make your fingerprint 
      identical to all other Mullvad Browser users. Use with a trusted VPN.
    • Tor Browser: Routes traffic through the Tor network. Maximum anonymity, but 
      significantly slower and will break some websites.
