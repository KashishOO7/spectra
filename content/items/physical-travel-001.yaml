id: physical-travel-001
schema_version: 1.0.0
version: 2.1.0
title: Prepare devices before crossing international borders
simple_description: Clear your phone of anything private before you cross a border.
description: |
  Border crossings are legally distinct zones in most countries — authorities can compel 
  device access or detain you with little or no suspicion required. Preparing a device 
  before travel limits data exposure without requiring you to refuse a lawful order.
threat_narrative: |
  CBP (US Customs) conducts tens of thousands of device searches annually. Courts in 
  multiple countries have upheld border device searches without warrants. Crossing with 
  an unencrypted device containing sensitive communications faces potential full data 
  extraction. Preparation before the border is the only effective defense.
category: physical_security
subcategory: travel_security
tracks:
  - general
  - journalist
platforms:
  - all
platform_notes:
  all: >-
    Do this

    Get your phone ready before you travel, not at the desk.


    Before you go

    Back up at home first, then delete from the device anything you will not need on the trip. The
    backup is what makes deleting it safe.

    Sign out of the accounts that matter, rather than trusting nobody will open them.


    At the crossing

    Power the device fully off before you arrive.

    Started from cold it wants your code, not your face or your finger, and at a border that
    difference matters.


    Worth knowing

    Rules differ by country, and in some places refusing has consequences.

    Finding out what applies where you are going is part of getting ready.
environment_notes:
  border_device_inspection: >-
    Do this before you leave

    Back up at home, then take the sensitive apps and accounts off the devices travelling with you.
    Put them back once you have arrived.

    Officers in many countries can ask for access to a device without a warrant, and in some places
    refusing carries a penalty.


    Why this rather than something cleverer

    A device that has nothing sensitive on it cannot be made to give anything up.

    Every other approach still depends on what you are asked to do at the desk, and on whether
    refusing is an option for you. This one does not.
  govt_monitors_traffic: >-
    Hotel and airport networks

    Treat the network as watched, and assume anything not encrypted is being recorded.

    Turn your VPN on before you join the network, not after. The first few seconds after connecting
    are when your device quietly tries every account it has saved.
