id: data-backup-001
schema_version: 1.0.0
version: 2.1.0
title: Back up somewhere the provider cannot read your files
simple_description: Back up your files to a service that cannot read them.
description: |
  Cloud backups are only as private as whoever holds the encryption key — usually
  the provider. Zero-knowledge cloud storage means your files are encrypted on your
  device before upload, so the provider stores ciphertext they cannot read even if
  compelled to. The easiest path is switching to a provider that does this by default.
  If you're locked into Google Drive or Dropbox, Cryptomator adds client-side
  encryption on top.
threat_narrative: |
  Every major cloud provider has received government data requests and complied.
  When your provider holds the encryption key, a breach, an insider threat, or a
  legal demand can expose everything you've backed up. A zero-knowledge provider
  stores only encrypted blobs — the key never leaves your device. Your backup
  content becomes unreadable to anyone without your password, including the provider.
category: data_management
subcategory: backup_security
tracks:
  - general
platforms:
  - all
platform_notes:
  all: >-
    Do this

    Back up your files somewhere the provider cannot read them.


    What to look for

    Wording like end-to-end encrypted, or zero-knowledge. Both mean the provider holds no key to
    your files.

    If you want to keep the storage you already pay for, encrypt the files yourself before they go
    up.

    Tools for that sit between you and the folder.


    Also

    Keep one copy somewhere not connected to the internet. A drive in a drawer survives things a
    cloud account does not.


    Test it

    Ask what happens if you forget the password. If the provider can get your files back for you,
    they could read them all along.
