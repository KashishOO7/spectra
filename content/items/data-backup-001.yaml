id: "data-backup-001"
schema_version: "1.0.0"
version: "2.0.0"
title: "Back up to a zero-knowledge cloud provider or encrypt before upload"
description: |
  Cloud backups are only as private as whoever holds the encryption key — usually
  the provider. Zero-knowledge cloud storage means your files are encrypted on your
  device before upload, so the provider stores ciphertext they cannot read even if
  compelled to. The easiest path is switching to a provider that does this by default.
  If you're locked into Google Drive or Dropbox, Cryptomator adds client-side
  encryption on top.
threat_narrative: |
  Every major cloud provider has received government data requests and complied.
  When your provider holds the encryption key, a breach, an insider threat, or a
  legal demand can expose everything you've backed up. A zero-knowledge provider
  stores only encrypted blobs — the key never leaves your device. Your backup
  content becomes unreadable to anyone without your password, including the provider.
category: data_management
subcategory: backup_security
tracks: ["general"]
platforms: ["all"]
platform_notes:
  general: |
    TIER 1 — Easiest: Switch to a zero-knowledge cloud provider (recommended for everyone).
    These services encrypt your files before upload by default — no extra steps, no extra software.

    Proton Drive (proton.me/drive)
    • Free: 1GB (usable for documents, photos). Paid plans start at 4€/month.
    • Open source, audited, based in Switzerland. Same privacy posture as ProtonMail.
    • Works on Android, iOS, Windows, macOS, web.

    Filen.io (filen.io)
    • Free: 10GB — the most generous free tier. Open source.
    • Zero-knowledge, end-to-end encrypted. Desktop sync clients available.
    • Good choice for users wanting more free storage than Proton Drive offers.

    Internxt (internxt.com)
    • Free: 10GB. Open source.
    • Zero-knowledge E2EE. Web, desktop, mobile clients.
    • Alternative to Filen with similar guarantees.

    TIER 2 — If you're staying with Google Drive/Dropbox/OneDrive:
    Use Cryptomator (free, open source, cryptomator.org) to create an encrypted vault
    inside your existing cloud folder. Files are encrypted locally before sync.
    Works on Windows, macOS, Linux, Android (Play Store / F-Droid), iOS (App Store).
    Setup: create a vault folder inside your cloud provider folder → unlock with a password →
    files placed inside the vault are encrypted transparently before upload.

    TIER 3 — Power users / self-hosted:
    Restic (restic.net) — open-source, encrypted incremental backups to any backend
    (local drive, SFTP, S3, Backblaze B2). Requires CLI comfort.
    Nextcloud / Seafile — self-hosted cloud storage with E2EE options.

  windows: |
    Easiest: Install Proton Drive or Filen.io desktop client and use it as your primary
    cloud folder. Works like Google Drive — drop files in, they sync encrypted.
    If keeping Google Drive/OneDrive: install Cryptomator, create a vault inside your
    cloud folder, set it to open on login. Files in the vault encrypt before sync.

  macos: |
    Easiest: Install Proton Drive desktop client or Filen.io (filen.io/download).
    iCloud note: iCloud Drive stores files with Apple holding the key by default.
    Enable iCloud Advanced Data Protection for E2EE: Settings → [Name] → iCloud →
    Advanced Data Protection. This is the highest-value single setting for iCloud users.
    For non-iCloud: use Proton Drive, Filen, or Cryptomator + existing provider.

  linux: |
    Filen.io and Proton Drive both have Linux desktop clients.
    For CLI-based encrypted backups: Restic is the gold standard.
    Quick start: restic init --repo sftp:user@host:/path/to/repo
    Then: restic backup /home/user --scheduled via cron or systemd timer.
    Cryptomator also has a Linux AppImage at cryptomator.org/downloads.

  android: |
    Proton Drive: available on Google Play and F-Droid (via Proton's repo).
    Filen.io: available on Google Play.
    Both encrypt before sync — install, sign in, enable auto-upload for photos/documents.
    If staying with Google Photos: note it is not zero-knowledge. For sensitive photos,
    use Proton Drive auto-upload instead.
    Cryptomator is also available on Play Store and F-Droid for existing cloud users.

  ios: |
    Priority action: Enable iCloud Advanced Data Protection.
    Settings → [Your Name] → iCloud → Advanced Data Protection → Turn On.
    This switches iCloud backups and Drive to end-to-end encryption. Takes 2 minutes.
    If not using iCloud: install Proton Drive (App Store) or Filen.io (App Store).
    Cryptomator is available on the App Store for encrypting existing provider storage.

