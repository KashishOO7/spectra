id: device-updates-001
schema_version: 1.0.0
version: 1.1.0
title: Turn on automatic updates for your phone and computer
simple_description: Turn on automatic updates on your phone and computer.
description: >-
  Security updates patch known vulnerabilities that attackers actively exploit. The time between a
  patch release and active exploitation is measured in days — sometimes hours. Delayed updates leave
  known attack paths open.
threat_narrative: >-
  The 2017 WannaCry ransomware crippled hospitals, banks, and governments across 150 countries — it
  exploited a Windows vulnerability that Microsoft had patched 2 months earlier. Every unpatched
  device is a machine with a published list of its own vulnerabilities. Automatic updates close that
  list faster than attackers can use it.
category: device_security
subcategory: updates_patching
tracks:
  - general
platforms:
  - all
platform_notes:
  all: >-
    Do this

    Turn on automatic updates everywhere: phone, computer, browser and apps.


    Why this one first

    Most attacks that reach ordinary people use a hole that was fixed months ago.

    This is the step that closes the most doors for the least effort.


    What to look for

    Settings, then Update. Turn on automatic download and install, and set it to install while you
    are asleep.

    Do your apps too. App stores have their own auto-update switch, separate from the system one.

    If your data allowance is limited, set both to update over wifi only. The setting sits next to
    the auto-update switch.


    Test it

    Open the update screen and look at the date of the last one. If it is months ago, automatic
    updates are not really on.
