id: "device-updates-001"
schema_version: "1.0.0"
version: "1.0.0"
title: "Enable automatic OS and app updates"
description: "Security updates patch known vulnerabilities that attackers actively exploit. The time between a patch release and active exploitation is measured in days — sometimes hours. Delayed updates leave known attack paths open."
threat_narrative: "The 2017 WannaCry ransomware crippled hospitals, banks, and governments across 150 countries — it exploited a Windows vulnerability that Microsoft had patched 2 months earlier. Every unpatched device is a machine with a published list of its own vulnerabilities. Automatic updates close that list faster than attackers can use it."
category: "device_security"
subcategory: "updates_patching"
tracks:
  - "general"
platforms:
  - "all"
platform_notes:
  windows: "Settings > Windows Update > Advanced Options > enable 'Receive updates for other Microsoft products'. Set Active Hours accurately so updates install while you sleep."
  macos: "System Settings > General > Software Update > enable 'Install Security Responses and System Files' and 'Install macOS updates'."
  linux: "Enable unattended-upgrades for security updates: sudo apt install unattended-upgrades && sudo dpkg-reconfigure unattended-upgrades. Other distros have equivalents."
  android: "Settings > System > Software Update. Also update apps: Play Store > Profile > Manage Apps > Update All."
  ios: "Settings > General > Software Update > Automatic Updates — enable both Download iOS Updates and Install iOS Updates."
  web: "Update browsers separately. Chrome/Firefox update automatically but verify: browser menu > Help > About."
