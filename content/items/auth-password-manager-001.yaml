id: auth-password-manager-001
schema_version: 1.0.0
version: 2.1.0
title: Use a password manager with unique passwords everywhere
simple_description: Use a password manager so every account gets a different password.
description: |
  A password manager generates and stores a unique, random password for every account. 
  You only remember one strong master password. This eliminates password reuse — the 
  single biggest cause of account takeover.
threat_narrative: |
  If you reuse a password across sites, one breach anywhere exposes every account using 
  that password. Automated tools test stolen credentials against hundreds of services 
  within hours of any breach. Password managers turn your biggest liability into your 
  strongest control.
category: account_security
subcategory: authentication
tracks:
  - general
platforms:
  - all
platform_notes:
  all: >-
    Do this

    Put your accounts into a password manager and let it make a different password for each one.


    Which kind

    One that syncs across your devices is easiest, and right for most people.

    One that keeps the file only on your machine is stronger, and you move that file around
    yourself.

    Either way the point is the same: only you can unlock it. If the company can reset your vault
    for you, they can open it.


    The one password you memorise

    Long beats complicated. Three or four unrelated words are stronger than one word with symbols
    stuck on the end.


    Test it

    Sign in to something on a second device. If the manager fills it in, your sync works and you can
    start replacing old passwords.
