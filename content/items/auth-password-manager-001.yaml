id: "auth-password-manager-001"
schema_version: "1.0.0"
version: "2.0.0"
title: "Use a password manager with unique passwords everywhere"
description: |
  A password manager generates and stores a unique, random password for every account. 
  You only remember one strong master password. This eliminates password reuse — the 
  single biggest cause of account takeover.
threat_narrative: |
  If you reuse a password across sites, one breach anywhere exposes every account using 
  that password. Automated tools test stolen credentials against hundreds of services 
  within hours of any breach. Password managers turn your biggest liability into your 
  strongest control.
category: "account_security"
subcategory: "authentication"
tracks:
  - "general"
platforms:
  - "all"
platform_notes:
  general: |
    TIER 1 — Easiest: Cloud-synced password managers (Recommended for most)
    These sync seamlessly across all your devices using zero-knowledge encryption.
    • Bitwarden (bitwarden.com): Free tier is excellent. Open-source, audited.
    • Proton Pass (proton.me/pass): Good if you are already in the Proton ecosystem.
    
    TIER 2 — Advanced: Local-only password managers (High threat models)
    Your vault never touches a cloud server. You must sync the encrypted file manually.
    • KeePassXC (keepassxc.org): The gold standard for desktop offline management.
    • KeePassDX (Android) / Strongbox (iOS): Mobile companions for KeePass files.
  android: "Install Bitwarden from F-Droid/Play Store, or KeePassDX for offline vaults. Go to Settings > Passwords & Accounts and set it as your autofill service."
  ios: "Install Bitwarden or Strongbox. Enable autofill: Settings > Passwords > AutoFill Passwords > select your manager."
  windows: "Use Bitwarden browser extension + desktop app, or KeePassXC. Disable Edge/Chrome's built-in password saving prompts."
  macos: "Bitwarden or KeePassXC. Apple's built-in Passwords app (macOS Sequoia+) is also a highly secure, E2EE alternative if you stay strictly within the Apple ecosystem."
  linux: "KeePassXC is heavily recommended here. Bitwarden AppImage is also available."
  web: "Use the manager's browser extension. Never let the browser save passwords alongside the manager."
