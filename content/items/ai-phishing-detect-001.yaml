id: ai-phishing-detect-001
schema_version: 1.0.0
version: 1.2.0
title: Check who a message is really from, however well written
simple_description: Check the sender before you trust a message, even a well-written one.
description: |
  Phishing used to announce itself with bad grammar and a generic greeting. A language model
  can write a fluent message and aim it at you personally, using what is already public about
  you. In the study behind this step, messages written this way for more than 600 members of
  one parliament were judged realistic and cost a fraction of a cent each to produce.
threat_narrative: |
  Someone can take what you have posted in public, your job, your employer, what you did last
  week, and have a model draft a message that fits. The study behind this step did exactly
  that, at scale, and found that basic prompting got past the safeguards meant to stop it.
  Looking for spelling mistakes no longer separates a real message from a fake one, so the
  check has to be on who sent it rather than on how it reads.
category: ai_threats
subcategory: ai_phishing_detection
tracks:
  - general
  - ai_focused
platforms:
  - all
platform_notes:
  all: >-
    Do this

    Check where a message came from before you act on it, even when it is well written.


    How to see who really sent it

    The name shown at the top of a message is typed in by whoever sent it, so it proves nothing on
    its own.

    Email: open the sender's details and read the whole address, especially the part after the @.
    That part is the one that cannot be faked. If it is not the organisation's own web address, the
    message is not from them. On a phone the address is hidden until you tap the sender's name.

    Text or chat: a sender you do not already have saved shows as a number or a short name that
    anyone can choose. Neither one tells you who it is.


    Why the old advice stopped working

    Bad spelling used to be the giveaway. AI writing tools mean a scam message now reads as well as a real one, so how a message
    reads tells you almost nothing.


    Test it

    Next time a message says there is a problem with an account, do not use its link.

    Open a new tab and reach the site the way you normally would, by your own saved bookmark or by
    typing the company's own web address. Never the link in the message.

    If the real site shows no such problem, the message was not real.
