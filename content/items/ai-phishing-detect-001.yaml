id: ai-phishing-detect-001
schema_version: 1.0.0
version: 1.2.0
title: Check who a message is really from, however well written
simple_description: Check the sender before you trust a message, even a well-written one.
description: |
  Traditional phishing had obvious tells: bad grammar, generic greetings, suspicious links. 
  AI-generated phishing is grammatically perfect, highly personalized using OSINT, and 
  indistinguishable from legitimate communication.
threat_narrative: |
  Attackers use Large Language Models (LLMs) to scrape your LinkedIn, public tweets, and 
  company news to draft spear-phishing emails in seconds. Because the text is flawless, 
  the old rule of "look for typos" is dangerously obsolete. 
category: ai_threats
subcategory: ai_phishing_detection
tracks:
  - general
  - ai_focused
platforms:
  - all
platform_notes:
  all: >-
    Do this

    Check where a message came from before you act on it, even when it is well written.


    Why the old advice stopped working

    Bad spelling used to be the giveaway. Anything can write clean English now, so how a message
    reads tells you almost nothing.


    Test it

    Next time a message says there is a problem with an account, do not use its link.

    Type the address in yourself and sign in.

    If the real site shows no such problem, the message was not real.
