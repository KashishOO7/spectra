id: "ai-phishing-detect-001"
schema_version: "1.0.0"
version: "1.1.0"
title: "Update your phishing detection instincts — grammar is no longer a red flag"
description: |
  Traditional phishing had obvious tells: bad grammar, generic greetings, suspicious links. 
  AI-generated phishing is grammatically perfect, highly personalized using OSINT, and 
  indistinguishable from legitimate communication.
threat_narrative: |
  Attackers use Large Language Models (LLMs) to scrape your LinkedIn, public tweets, and 
  company news to draft spear-phishing emails in seconds. Because the text is flawless, 
  the old rule of "look for typos" is dangerously obsolete. 
category: "ai_threats"
subcategory: "ai_phishing_detection"
tracks:
  - "general"
  - "ai_focused"
platforms:
  - "all"
platform_notes:
  all: |
    Replace the "grammar check" mental model with the Zero-Trust Evaluation model.
    Ask these three questions before acting:
    1. Initiation: Did I initiate this conversation or request? (If no, escalate suspicion).
    2. Emotion: Does this message create a sense of urgency, fear, or sudden reward?
    3. Action: Is it asking me to click a link, download a file, or enter a password?
    If an uninitiated message creates urgency and demands action, it is hostile until 
    proven otherwise via an independent channel.
