id: data-broker-optout-001
schema_version: 1.0.0
version: 2.2.0
title: Remove yourself from data broker databases
simple_description: Ask the companies that sell your personal details to remove you.
description: |
  Data brokers aggregate your name, address history, phone numbers, relatives, and 
  purchasing history into profiles sold to anyone willing to pay. Opting out significantly 
  reduces your findability and the richness of profiles available to attackers.
threat_narrative: |
  Stalkers, scammers, and social engineers routinely use data broker sites to find 
  your current address, phone number, and daily patterns — often for free. In documented 
  cases, perpetrators have used these lookups to track individuals who had moved. 
  Removal is an ongoing process that raises the cost of finding you significantly.
category: data_management
subcategory: data_deletion
tracks:
  - general
  - womens_safety
  - journalist
platforms:
  - web
platform_notes:
  all: >-
    Do this

    Ask the companies that collect and sell personal details to take yours down.


    How it works

    Search your own name and town and see which people-search sites list you.

    Each has a removal or opt-out page, usually linked in small text at the bottom.

    Removal takes a form, and sometimes a wait.

    Expect to repeat it, because entries come back when a site buys a fresh copy of the data.


    Two rules

    Never pay to be removed. It is free on any site that will do it at all.

    Never hand over more than they already hold to prove who you are.


    Test it

    Search your name again in a month. What has come back tells you which sites are worth repeating
    and which are not.
not_applicable_if: []
environment_notes:
  has_data_protection_rights: >-
    Removal is something you can require

    Where you live, this is a right rather than a favour, and the law puts a deadline on the answer.


    Say so in the request

    Name the law and use the words right to erasure, or right to delete. In Europe that right is in
    the GDPR. In California it is in the CCPA. Naming it turns a polite request into one they have
    to answer.

    Keep the date you sent it and a copy of what you sent. That is what a complaint later rests on.

    If the deadline passes and nothing happens, your country has a data protection regulator you can
    complain to, and complaining costs nothing.


    This does not change the two rules above

    You still never pay to be removed, and you still never hand over more than they already hold.

    A paid removal service has no power here that your own letter does not already have.
