id: "data-broker-optout-001"
schema_version: "1.0.0"
version: "2.0.0"
title: "Remove yourself from data broker databases"
description: |
  Data brokers aggregate your name, address history, phone numbers, relatives, and 
  purchasing history into profiles sold to anyone willing to pay. Opting out significantly 
  reduces your findability and the richness of profiles available to attackers.
threat_narrative: |
  Stalkers, scammers, and social engineers routinely use data broker sites to find 
  your current address, phone number, and daily patterns — often for free. In documented 
  cases, perpetrators have used these lookups to track individuals who had moved. 
  Removal is an ongoing process that raises the cost of finding you significantly.
category: "data_management"
subcategory: "data_deletion"
tracks:
  - "general"
  - "womens_safety"
  - "journalist"
platforms:
  - "web"
platform_notes:
  web: |
    TIER 1 — Manual & Free (Time intensive)
    Use the EFF's Data Broker Opt-Out Guide or Michael Bazzell's IntelTechniques workbook.
    • Search yourself on top sites: Spokeo, WhitePages, Intelius, BeenVerified, TruePeopleSearch.
    • Submit manual opt-out requests. Never pay a fee to opt out, and never provide a real 
      ID unless legally required (use a redacted copy).

    TIER 2 — Automated Paid Services (Recommended for efficiency)
    If you lack the time, these services automate the legal requests and monitor for reappearance.
    • EasyOptOuts: Highly rated, budget-friendly, effective for US residents.
    • DeleteMe or Incogni: More expensive but cover a broader international spectrum.
