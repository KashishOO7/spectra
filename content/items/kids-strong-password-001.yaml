# PSSAF Checklist Item
# Personal Security Self-Audit Framework — kids_teen track

id: "kids-strong-password-001"
schema_version: "1.0.0"
version: "1.0.0"

title: "Help your child set strong, unique passwords for their accounts"

description: |
  Children often use the same simple password across every account — their name, a pet,
  a birthdate. Teaching the habit of unique, non-guessable passwords early is one of
  the most durable security skills they'll carry into adulthood. A password manager
  makes this achievable even for younger users.

threat_narrative: |
  A classmate, online contact, or stranger who guesses a child's password on one
  platform can often get into every account they own — because children almost never
  use unique passwords. Gaming accounts, social profiles, and school email are all
  connected targets. Account takeovers of children's gaming profiles are extremely
  common and frequently used to extract personal information or as stepping stones
  to contact the child directly.

category: "account_security"
subcategory: "authentication"

tracks:
  - "kids_teen"

platforms:
  - "all"

platform_notes:
  android: |
    Built-in Android password manager (Google Passwords) can generate and store strong
    passwords — enable in Settings → Passwords & accounts. For older teens who want
    independence, Bitwarden (free, open source) works well on Android.
  ios: |
    Built-in iCloud Keychain generates and stores strong passwords — works automatically
    in Safari and iOS apps. Go to Settings → Passwords to review stored passwords.
    For cross-platform or non-Apple needs, Bitwarden is recommended.
  windows: |
    Edge and Chrome both have built-in password managers. For a more robust option
    that works across all apps and browsers, Bitwarden is free and easy for young users.
  macos: |
    Safari's built-in password management (Keychain) is excellent and automatic.
    The Passwords app in macOS Sequoia (15+) provides a standalone view of all stored passwords.

