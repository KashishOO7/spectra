id: "human-urgency-001"
schema_version: "1.0.0"
version: "1.0.0"
title: "Train yourself to pause when you feel urgency from external messages"
description: "Urgency is the most common manipulation technique in phishing, fraud calls, and social engineering. Attackers manufacture time pressure specifically to disable critical thinking. Any message demanding immediate action without time to verify deserves maximum suspicion."
threat_narrative: "Every successful social engineering attack works by preventing you from thinking. 'Your account will be closed in 24 hours.' 'This is IT support — your computer is compromised right now.' 'The boss needs gift cards immediately.' All exploit the same psychological trigger. Urgency is a red flag, never a reason to act faster. Training yourself to pause for 10 minutes before responding to any urgent external request costs nothing and defeats the most common attack vector in existence."
category: "human_vulnerability"
subcategory: "emotional_triggers"
tracks:
  - "general"
platforms:
  - "all"
platform_notes:
  all: "This is a behavioral practice, not a software setting. The rule: when you feel urgency from an external message or call, wait 10 minutes before responding. Verify through an independent channel — look up the phone number yourself from the official website, not from the message. Every real emergency can survive 10 minutes."
