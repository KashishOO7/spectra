id: human-urgency-001
schema_version: 1.0.0
version: 1.1.0
title: Train yourself to pause when you feel urgency from external messages
simple_description: Slow down when a message pressures you to act immediately.
description: >-
  Urgency is the most common manipulation technique in phishing, fraud calls, and social
  engineering. Attackers manufacture time pressure specifically to disable critical thinking. Any
  message demanding immediate action without time to verify deserves maximum suspicion.
threat_narrative: >-
  Every successful social engineering attack works by preventing you from thinking. 'Your account
  will be closed in 24 hours.' 'This is IT support — your computer is compromised right now.' 'The
  boss needs gift cards immediately.' All exploit the same psychological trigger. Urgency is a red
  flag, never a reason to act faster. Training yourself to pause for 10 minutes before responding to
  any urgent external request costs nothing and defeats the most common attack vector in existence.
category: human_vulnerability
subcategory: emotional_triggers
tracks:
  - general
platforms:
  - all
platform_notes:
  all: >-
    Do this

    When a message or a call pushes you to act right now, wait ten minutes before you do anything.


    Why ten minutes

    The pressure is the tool. It is there to stop you checking.

    Ten minutes is long enough to notice it, and every real emergency survives it.


    Then check

    Go back a different way. Look the number up yourself, or type the address in. Never the number
    or link in the message.


    Test it

    Next time something urgent arrives, notice how it makes you feel before you work out what it
    says.

    That feeling is the thing you are training against.
