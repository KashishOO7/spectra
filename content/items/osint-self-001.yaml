id: "osint-self-001"
schema_version: "1.0.0"
version: "2.0.0"
title: "Run a passive self-OSINT audit"
description: |
  Open-source intelligence (OSINT) is the practice of gathering information about a target 
  from public sources. Running OSINT on yourself reveals what attackers can find — your 
  home address, relationships, daily patterns — before they weaponize it.
threat_narrative: |
  You cannot defend a perimeter you haven't mapped. Data brokers, public social media, 
  and breach dumps legally expose your life. A stalker or targeted attacker can build a 
  complete profile of your vulnerabilities for under $5. A self-OSINT audit is the map 
  of your own exposure.
category: "osint_footprint"
subcategory: "self_osint_audit"
tracks:
  - "general"
  - "journalist"
  - "womens_safety"
platforms:
  - "web"
platform_notes:
  web: |
    THE OSINT MAP:
    1. Search Engine Dorking: Search your full name in quotes. Then add your city. 
       Then search your phone number and primary email in quotes.
    2. Data Brokers: Search yourself on Spokeo, WhitePages, BeenVerified, and FastPeopleSearch.
    3. Username Mapping: Run your primary usernames through namecheckr.com or WhatsMyName.app 
       to see where else you have forgotten accounts.
    4. Breach Check: Check all emails and phone numbers on HaveIBeenPwned.
    Document everything you find. This list becomes your cleanup priority list.
