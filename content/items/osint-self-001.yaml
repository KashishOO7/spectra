id: osint-self-001
schema_version: 1.0.0
version: 2.1.0
title: Look yourself up the way a stranger would
simple_description: Search for your own name and see what strangers can find.
description: |
  Open-source intelligence (OSINT) is the practice of gathering information about a target 
  from public sources. Running OSINT on yourself reveals what attackers can find — your 
  home address, relationships, daily patterns — before they weaponize it.
threat_narrative: |
  You cannot defend a perimeter you haven't mapped. Data brokers, public social media, 
  and breach dumps legally expose your life. A stalker or targeted attacker can build a 
  complete profile of your vulnerabilities for under $5. A self-OSINT audit is the map 
  of your own exposure.
category: osint_footprint
subcategory: self_osint_audit
tracks:
  - general
  - journalist
  - womens_safety
platforms:
  - web
platform_notes:
  all: >-
    Do this

    Look yourself up the way a stranger would, and write down what you find.


    What to search

    Your full name in quotes. Then your name plus your town. Then your phone number and each email
    address you use, in quotes.

    Then search your usual username. Forgotten accounts are usually the ones still holding old
    details.


    Also check

    Put your main email into Have I Been Pwned at haveibeenpwned.com.

    Searching is free and needs no account, and it tells you which known leaks your address turned
    up in.


    What to do with the list

    What you find here sets the order you clean things up in. Start with whatever surprised you
    most.
