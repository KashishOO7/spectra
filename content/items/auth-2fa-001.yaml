id: auth-2fa-001
schema_version: 1.0.0
version: 2.1.0
title: Enable two-factor authentication on all critical accounts
simple_description: Turn on two-step login for your email.
description: |
  Two-factor authentication requires a second proof of identity beyond your password,
  such as a time-based code, hardware key, or biometric. Even if your password is stolen,
  an attacker cannot access your account without the second factor. Never use SMS for 2FA.
threat_narrative: |
  Billions of credentials are exposed in breaches every year. Without 2FA, a stolen 
  password is an open door. The majority of account takeovers in 2024 involved accounts 
  with no second factor. SMS 2FA is highly vulnerable to SIM-swapping, where attackers 
  steal your phone number to intercept codes.
category: account_security
subcategory: authentication
tracks:
  - general
platforms:
  - all
platform_notes:
  all: >-
    Do this

    Turn on two-step login on your most important accounts. Email first, then anything with money in
    it, then your password manager.

    Setting it up offers you a list of backup codes. Save them while that screen is open. Most
    accounts will not show you the same list again, and those codes are how you get back in if you
    lose the phone.


    Which kind

    Use an authenticator app for the codes, not text messages.

    A text code can be stolen without touching your phone: someone calls your mobile network, pretends to be you, and has your number moved to a SIM card they hold. An app on your phone cannot be moved that way.

    A small key you plug in or tap is stronger again, and worth it for your email.


    Already using an authenticator app?

    It works, keep using it.

    Check one thing in its settings: whether it can back your codes up, and whether that backup is
    locked with a password only you know. Some apps keep no backup at all, so a lost phone takes
    every code with it.

    If yours cannot back up, saved backup codes are what covers you instead.


    Test it

    Sign out of one of those accounts and sign back in. You should be asked for a code.
