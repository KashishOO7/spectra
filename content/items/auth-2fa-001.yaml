id: "auth-2fa-001"
schema_version: "1.0.0"
version: "2.0.0"
title: "Enable two-factor authentication on all critical accounts"
description: |
  Two-factor authentication requires a second proof of identity beyond your password — 
  a time-based code, hardware key, or biometric. Even if your password is stolen, 
  an attacker cannot access your account without the second factor. Never use SMS for 2FA.
threat_narrative: |
  Billions of credentials are exposed in breaches every year. Without 2FA, a stolen 
  password is an open door. The majority of account takeovers in 2024 involved accounts 
  with no second factor. SMS 2FA is highly vulnerable to SIM-swapping, where attackers 
  steal your phone number to intercept codes.
category: "account_security"
subcategory: "authentication"
tracks:
  - "general"
platforms:
  - "all"
platform_notes:
  general: |
    TIER 1 — Standard: Authenticator Apps (TOTP)
    Generates offline codes on your device. Immune to SIM-swapping.
    • Aegis Authenticator (Android): Open source, encrypted local backups.
    • Raivo OTP or Ente Auth (iOS): Open source, privacy-respecting.
    
    TIER 2 — Advanced: Hardware Security Keys (FIDO2/WebAuthn)
    Physical USB/NFC keys. Immune to real-time phishing relays. Recommended for high-value accounts (Email, Banking, Password Manager).
    • YubiKey (Yubico) or Nitrokey. 
    • Always buy two (one main, one backup stored securely).
  android: "Install Aegis Authenticator via F-Droid (preferred) or Play Store. Enable 2FA per-service under each app's Security settings."
  ios: "Install Ente Auth or Raivo OTP from App Store. For Apple ID: Settings > [Your Name] > Password & Security > Two-Factor Authentication."
  windows: "For Windows Hello / Microsoft accounts, hardware keys or the authenticator app are ideal. Avoid SMS recovery."
  macos: "macOS Passwords app (Ventura+) supports TOTP natively. Hardware keys are plug-and-play for iCloud and web services."
  linux: "Use KeePassXC for TOTP generation on desktop. Hardware keys (YubiKey) work well via libfido2."
