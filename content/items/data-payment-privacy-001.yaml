id: "data-payment-privacy-001"
schema_version: "1.0.0"
version: "1.0.0"
title: "Review privacy and data sharing settings in payment apps"
description: |
  Payment services track transaction history, merchant categories, spending
  patterns, and location of purchases. This data is used for ad targeting,
  credit scoring, and sold to data brokers. Most payment apps share purchase
  data with partners by default and require explicit opt-out.
threat_narrative: |
  Your transaction history reveals where you live, work, eat, travel, and
  what you buy. Payment apps share merchant category data with ad networks
  who use it to build spending profiles. Banks sell anonymised transaction
  data to analytics firms. In a 2024 study, researchers identified 90% of
  individuals from four transaction data points alone. An intimate partner
  with access to shared payment accounts can track your movements through
  purchase locations. A data broker aggregating payment data builds a
  financial profile that follows you across institutions.
category: "data_management"
subcategory: "data_minimization"
tracks:
  - "general"
  - "womens_safety"
platforms:
  - "android"
  - "ios"
  - "web"
platform_notes:
  android: |
    GOOGLE PAY / GOOGLE WALLET
    • pay.google.com/payments/home → Settings → disable transaction notifications
      shared with Google for ad personalisation.
    • Review linked accounts and remove cards/banks you no longer use.
    • Check Google Pay activity in myaccount.google.com/activitycontrols — purchase
      history feeds into the same profile as search and location.

    BANKING AND UPI APPS
    • Open each banking app → Settings → Privacy/Marketing/Notifications.
    • Disable marketing communications, personalised offers, and partner data sharing.
    • UPI apps (GPay, PhonePe, Paytm): check for merchant data sharing,
      transaction-based recommendations, and promotional settings. Turn off.
  ios: |
    APPLE PAY / WALLET
    • Settings → Wallet & Apple Pay → review linked cards.
    • Apple does not share transaction details with merchants beyond what's needed
      for the transaction. But third-party payment apps on iOS do.
    • Review Apple Card statements if applicable — Goldman Sachs collects
      transaction data under a separate privacy policy.

    BANKING APPS
    • Same as Android: open each app, find Privacy/Marketing settings, disable
      partner sharing and personalised offers.
  web: |
    PAYPAL — paypal.com/myaccount/privacy/
    • Privacy Settings → Manage your data → review and restrict sharing with
      third-party merchants and PayPal partners.
    • Disable personalised shopping experiences and targeted offers.
    • Review Connected Apps and remove services you no longer use.

    ONLINE BANKING
    • Log into each bank's web portal → Settings/Privacy/Communications.
    • Disable marketing preferences, data sharing with affiliates, and
      pre-screened credit offers.
    • In the US: opt out of pre-screened offers at optoutprescreen.com.
    • Review connected third-party services (Plaid, Yodlee) that have read
      access to your transactions.

    General principle: any app that can see your money can see your patterns.
    Disable everything that isn't required for the service to function.
