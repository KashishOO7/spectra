environment_notes:
  has_data_protection_rights: |
    If you have data protection rights (GDPR, CCPA, etc.), you can request
    your payment providers disclose what transaction data they share and with
    whom. File a Subject Access Request or data access request with each
    provider. They must respond within the statutory period.
