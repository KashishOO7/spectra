id: "comm-messaging-001"
schema_version: "1.0.0"
version: "2.0.0"
title: "Switch primary messaging to an end-to-end encrypted app"
description: |
  End-to-end encryption (E2EE) means only you and the recipient can read messages — 
  not the app company, not your ISP, not anyone intercepting the connection. SMS and 
  most built-in messaging apps do not provide this protection.
threat_narrative: |
  Regular SMS is visible to your carrier, law enforcement via subpoena, and anyone 
  with SS7 network access. WhatsApp uses E2EE for messages but its metadata (who you 
  message, when, how often) goes to Meta. For true privacy, you need E2EE paired with 
  zero-knowledge metadata architecture.
category: "communications"
subcategory: "messaging"
tracks:
  - "general"
  - "journalist"
  - "womens_safety"
platforms:
  - "all"
platform_notes:
  general: |
    TIER 1 — Best for Most: Signal
    The gold standard for E2EE. Audited, open-source, non-profit. Metadata is sealed.
    Caveat: Requires a phone number to register (though you can now hide it in app settings).
    
    TIER 2 — Advanced Anonymity: SimpleX Chat or Session
    For threat models where linking a phone number to an identity is dangerous.
    • SimpleX: No user IDs whatsoever. Routes traffic via decentralized servers.
    • Session: Uses onion-routing to hide IP addresses. No phone number required.
  android: "Install Signal from Play Store or signal.org/android. Do not use standard SMS apps for sensitive data."
  ios: "Signal available on App Store. While iMessage is E2EE, it lacks cross-platform compatibility and Apple retains metadata/backups if Advanced Data Protection is off."
  windows: "Signal desktop app at signal.org. Must be linked to a mobile Signal account."
  macos: "Signal desktop at signal.org."
  linux: "Signal available via apt or flatpak for standard distros."
