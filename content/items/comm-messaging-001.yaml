id: comm-messaging-001
schema_version: 1.0.0
version: 2.1.0
title: Switch primary messaging to an end-to-end encrypted app
simple_description: Move your everyday messages to a chat app that encrypts them.
description: |
  End-to-end encryption (E2EE) means only you and the recipient can read messages — 
  not the app company, not your ISP, not anyone intercepting the connection. SMS and 
  most built-in messaging apps do not provide this protection.
threat_narrative: |
  Regular SMS is visible to your carrier, law enforcement via subpoena, and anyone 
  with SS7 network access. WhatsApp uses E2EE for messages but its metadata (who you 
  message, when, how often) goes to Meta. For true privacy, you need E2EE paired with 
  zero-knowledge metadata architecture.
category: communications
subcategory: messaging
tracks:
  - general
  - journalist
  - womens_safety
platforms:
  - all
platform_notes:
  all: >-
    Do this

    Move your everyday messages to an app that encrypts them end to end.


    What to look for

    Encryption on by default, for every chat, not something you switch on each time.

    Code others can inspect.

    And ask what it knows besides your messages, because who you spoke to and when is its own kind
    of record.

    If giving a phone number is a problem for you, some apps do not ask for one.


    Worth knowing

    Encryption protects a message on its way. Anyone holding an unlocked phone at either end reads
    it anyway.


    Test it

    Open a chat and find the safety or verification screen.

    If you can compare a short code with the other person, the encryption is real and nobody is
    sitting in the middle.
environment_notes:
  encrypted_comms_restricted: |
    Switching to Signal may be visible to your ISP or carrier even if message
    content is protected. In environments where E2EE apps are monitored or
    restricted, evaluate whether switching platforms visibly creates additional
    risk before making the change.
  govt_monitors_traffic: |
    Your ISP can see which apps you use even if it cannot read message content.
    Consider pairing Signal with a VPN to obscure the traffic pattern, and be
    aware that app store downloads may be logged.
