id: kids-privacy-social-001
schema_version: 1.0.0
version: 1.1.0
title: Set all social and gaming accounts to private or friends-only
simple_description: Set your child's social and gaming accounts to private.
description: >-
  Public profiles on social media and gaming platforms make it easy for strangers to find, follow,
  and contact you. Setting accounts to private means only people you've approved can see your posts,
  your friend list, and who you are. This is the single highest-impact privacy action for anyone who
  uses social media.
threat_narrative: >-
  Predators, scammers, and online bullies use public profiles to identify targets, learn personal
  details, and make contact before you can recognise a threat. A public profile showing your school,
  location, and friend network is an open invitation. Private settings remove you from public search
  results and stop unsolicited contact from strangers — while keeping everything visible to people
  you've actually chosen.
category: osint_footprint
subcategory: social_media_exposure
tracks:
  - kids_teen
  - general
platforms:
  - all
platform_notes:
  all: >-
    Do this

    Set every social and gaming account your child uses to private, or to friends only.


    What to change

    Look under Privacy in each app.

    Set the account to private. Limit who can message them.

    Limit who can see posts and stories, and turn off anything that suggests their account to
    strangers.

    Gaming accounts have the same controls under Account or Privacy. Set who can see what they play
    and who can send friend requests.


    Do it together

    Change it with them rather than behind them. Anything they do not understand, they will undo.


    Test it

    Search for their username while logged out. If you can see their posts, so can anyone.
