id: "kids-privacy-social-001"
schema_version: "1.0.0"
version: "1.0.0"
title: "Set all social and gaming accounts to private or friends-only"
description: "Public profiles on social media and gaming platforms make it easy for strangers to find, follow, and contact you. Setting accounts to private means only people you've approved can see your posts, your friend list, and who you are. This is the single highest-impact privacy action for anyone who uses social media."
threat_narrative: "Predators, scammers, and online bullies use public profiles to identify targets, learn personal details, and make contact before you can recognise a threat. A public profile showing your school, location, and friend network is an open invitation. Private settings remove you from public search results and stop unsolicited contact from strangers — while keeping everything visible to people you've actually chosen."
category: "osint_footprint"
subcategory: "social_media_exposure"
tracks:
  - "kids_teen"
  - "general"
platforms:
  - "all"
platform_notes:
  all: |
    Instagram: Settings → Privacy → Account Privacy → Private Account.
    Also: Settings → Privacy → Messages → set who can DM you to "People You Follow."

    TikTok: Profile → ☰ → Settings → Privacy → Private Account. Also disable "Suggest your account to others."

    Snapchat: ⚙ Settings → Privacy Controls → set both "Contact Me" and "View My Story" to Friends.

    Discord: User Settings → Privacy & Safety → set "Who can add you as a friend" and close DMs from server members.
    Only join servers you or a trusted adult chose — Discord servers are public communities.

    Gaming (Xbox, PlayStation, Steam): each has Account / Privacy settings.
    Xbox: xbox.com → Settings → Privacy & Online Safety → set to "Friends only."
    PlayStation: Settings → Account Management → Privacy Settings.
    Steam: Profile → Edit Profile → Privacy Settings → set all to Friends Only or Private.
