id: "threat-intimate-physical-access-001"
schema_version: "1.0.0"
version: "1.0.0"

adversary_type: "intimate_partner"
attack_vector: "physical_access"

title: "Intimate Partner Physical Device Access"
description: |
  A current or former intimate partner, family member, or cohabitant uses
  physical access to a device to install stalkerware, extract data, review
  messages, or reconfigure accounts and security settings. This adversary
  type is uniquely dangerous because trust has already been extended: they
  know passwords, have physical proximity, and may have legal access to
  shared spaces. The harm is often ongoing — not a single breach event.

sophistication_required: 1
prevalence: "common"
likelihood_without_controls: "high"

