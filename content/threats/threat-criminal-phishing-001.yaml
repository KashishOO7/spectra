  - url: "https://ssd.eff.org/module/how-avoid-phishing-attacks"
    title: "EFF SSD — How to Avoid Phishing Attacks"
    description: "EFF's surveillance self-defence guide to recognising and resisting phishing at all sophistication levels."
    type: "case_study"

prevalence_data:
  - stat: "Phishing remains the most common initial access vector in financially motivated cybercrime."
    source: "https://ssd.eff.org/module/how-avoid-phishing-attacks"
    date: "2025-06"

mitigated_by:
  - id: "ai-phishing-detect-001"
    mitigation_effectiveness: 0.75
    reason: "Awareness of AI-enhanced phishing techniques and verification habits reduce susceptibility to convincing lures."
  - id: "auth-2fa-001"
    mitigation_effectiveness: 0.65
    reason: "TOTP 2FA significantly raises the cost of phishing but is vulnerable to real-time relay attacks. Hardware keys score higher."
  - id: "human-urgency-001"
    mitigation_effectiveness: 0.60
    reason: "Recognising and resisting artificial urgency — the primary phishing emotional trigger — interrupts the attack before credential entry."
  - id: "human-verify-001"
    mitigation_effectiveness: 0.70
    reason: "Out-of-band verification habits (call the organisation directly, check the URL carefully) are highly effective against impersonation."

