id: "threat-criminal-phishing-001"
schema_version: "1.0.0"
version: "1.0.0"

adversary_type: "criminal_org"
attack_vector: "phishing"

title: "Criminal Organisation Phishing Campaign"
description: |
  Organised criminal groups run large-scale phishing operations targeting
  financial accounts, corporate credentials, and cloud data. Unlike opportunistic
  phishing, criminal organisations invest in convincing impersonation infrastructure:
  lookalike domains, real-time TOTP relay proxies, and AI-generated personalised
  lures. Some operations are semi-targeted — they use data broker profiles to
  personalise attacks at scale without full spear-phishing investment.

sophistication_required: 3
prevalence: "common"
likelihood_without_controls: "medium"

