id: "threat-opportunistic-credential-stuffing-001"
schema_version: "1.0.0"
version: "1.0.0"

adversary_type: "opportunistic"
attack_vector: "credential_stuffing"

title: "Opportunistic Credential Stuffing"
description: |
  Automated tools take username/password combinations leaked from previously
  compromised services and try them systematically across hundreds of other
  sites. The attack is fully automated and untargeted — the adversary does not
  know or care who you are. If a password from any past breach matches your
  current password anywhere, this attack will find it, typically within hours
  of a new breach dataset being ingested.

sophistication_required: 1
prevalence: "common"
likelihood_without_controls: "high"

real_world_examples:
  - url: "https://haveibeenpwned.com/PwnedWebsites"
    title: "Have I Been Pwned — Known Breach Database"
    description: "Live catalogue of credential breaches actively used in stuffing operations."
    type: "dataset"
  - url: "https://owasp.org/www-community/attacks/Credential_stuffing"
    title: "OWASP — Credential Stuffing"
    description: "Technical description and documented prevalence of the attack pattern."
    type: "case_study"

prevalence_data:
  - stat: "Billions of username/password pairs are available in public breach databases."
    source: "https://haveibeenpwned.com"
    date: "2026-01"
  - stat: "Credential stuffing is one of the most common automated attacks on web applications."
    source: "https://owasp.org/www-community/attacks/Credential_stuffing"
    date: "2025-06"

mitigated_by:
  - id: "auth-2fa-001"
    mitigation_effectiveness: 0.95
    reason: "2FA makes stolen credentials alone insufficient — the attacker also needs the second factor in real time."
  - id: "auth-password-manager-001"
    mitigation_effectiveness: 0.85
    reason: "Unique passwords per service mean a breach at one site cannot cascade to others."
  - id: "incident-breach-monitor-001"
    mitigation_effectiveness: 0.30
    reason: "Breach monitoring does not prevent stuffing but enables rapid credential rotation when exposure is detected."

