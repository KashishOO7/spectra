    path { stroke: #0b7a6e; }
    @media (prefers-color-scheme: dark) { path { stroke: #5ccfc0; } }
  </style>
  <path d="M14 3.5a10.5 10.5 0 0 0 0 21" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M14 3.5a10.5 10.5 0 0 1 0 21" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 4.4" opacity="0.85"/>
</svg>
